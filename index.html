<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>藥智通</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%230f6e56%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2718%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27sans-serif%27%3E%E8%97%A5%3C/text%3E%3C/svg%3E">
  <style>
/* 藥智通 網頁示範版
   設計前提：主要讀者是 68 歲的長者。基礎字級 18px、行高 1.7、對比高、
   每個元素一個目的一個動作。強調色只有一個（深青綠），警示用琥珀，嚴重用磚紅。 */

:root {
  --ink: #1d2422;
  --ink-2: #4c5754;
  --ink-3: #7a8582;
  --paper: #ffffff;
  --ground: #f3f5f4;
  --line: #d9dedc;
  --line-2: #eef1f0;
  --accent: #0f6e56;
  --accent-ink: #ffffff;
  --accent-soft: #e3f1ec;
  --amber: #8a5a00;
  --amber-soft: #fff4dc;
  --brick: #9b2c1f;
  --brick-soft: #fbe9e6;
  --radius-s: 4px;
  --radius-m: 10px;
  --shell: 720px;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-display: "LXGW WenKai TC", "Noto Serif TC", "PMingLiU", serif;
}

* { box-sizing: border-box; }
html { font-size: 18px; }
body {
  margin: 0;
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--ground);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
body[data-scale="large"] { font-size: 21px; }
body[data-scale="xl"] { font-size: 24px; }

h1, h2, h3 { font-family: var(--font-display); font-weight: 600; line-height: 1.3; margin: 0; }
h1 { font-size: 1.7rem; }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.1rem; }
p { margin: 0 0 0.8em; }
p:last-child { margin-bottom: 0; }
a { color: var(--accent); }
button { font: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }

/* 版面 */
.topbar { background: transparent; }
.topbar-inner {
  max-width: var(--shell); margin: 0 auto; padding: 0.7rem 1rem 0;
  display: flex; align-items: center; gap: 1rem;
}
.brand { font-family: var(--font-display); font-size: 1.25rem; font-weight: 600; letter-spacing: 0.02em; }
.brand small { font-family: var(--font-body); font-size: 0.72rem; color: var(--ink-3); margin-left: 0.5rem; font-weight: 400; }
.topbar-actions { margin-left: auto; display: flex; gap: 0.6rem; align-items: center; }
.scale-switch { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius-s); overflow: hidden; }
.scale-switch { background: var(--paper); }
.scale-switch button { border: 0; background: transparent; padding: 0.2rem 0.6rem; color: var(--ink-2); }
.scale-switch button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

.stepper {
  max-width: var(--shell); margin: 0 auto; padding: 0.5rem 1rem 0;
  display: flex; gap: 0.35rem; overflow-x: auto; scrollbar-width: none;
}
.stepper::-webkit-scrollbar { display: none; }
.step-dot {
  flex: 0 0 auto; font-size: 0.78rem; color: var(--ink-3);
  padding: 0.15rem 0.55rem; border-radius: 999px; white-space: nowrap;
}
.step-dot[data-state="current"] { background: var(--accent-soft); color: var(--accent); }
.step-dot[data-state="done"] { color: var(--ink-2); }
.step-dot[data-state="done"]::before { content: "✓ "; }

.disclaimer {
  max-width: var(--shell); margin: 0.6rem auto 0; padding: 0 1rem;
  font-size: 0.82rem; color: var(--ink-2);
}

main { max-width: var(--shell); margin: 0 auto; padding: 1rem 1rem 3rem; }
.action-row { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; margin-top: 1.4rem; padding-top: 1rem; border-top: 1px solid var(--line); }
.action-row .btn-primary { min-width: 11rem; padding: 0.8rem 1.6rem; font-size: 1.05rem; }
.foot-note { font-size: 0.9rem; color: var(--ink-2); flex: 1; min-width: 12rem; }
.foot-note[data-tone="block"] { color: var(--amber); }
.menu-wrap { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 0.4rem); background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-m); min-width: 11rem; padding: 0.3rem; z-index: 30; box-shadow: 0 6px 20px rgba(0,0,0,0.12); }
.menu button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 0.55rem 0.8rem; border-radius: var(--radius-s); }
.menu button:hover { background: var(--line-2); }
.med-card.is-link { cursor: pointer; transition: border-color 120ms ease; }
.med-card.is-link:hover { border-color: var(--accent); }
.med-card.is-link:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.med-card.is-locked { opacity: 0.6; cursor: not-allowed; }
.med-card.is-editing { border-color: var(--accent); }
.med-card .field select { border: 1px solid var(--line); border-radius: var(--radius-s); padding: 0.45rem 0.6rem; background: var(--paper); }
.fam-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0.5rem 1rem; }
.fam-row { display: flex; align-items: center; gap: 0.6rem; }
.fam-row .choice { min-width: 5.5rem; }
.fam-row .multi-select { flex: 1; min-width: 9rem; }
.fam-other { grid-column: 1 / -1; flex-wrap: wrap; }
.fam-other .inline-input { flex: 1 1 12rem; min-width: 10rem; }
.fam-other .multi-select { flex: 0 1 14rem; }
.age-out { color: var(--ink-2); margin-left: 0.5rem; }
.dose-input { display: flex; gap: 0.4rem; align-items: center; }
.dose-input input[type="number"] { width: 5.5rem; }
.multi-select { position: relative; }
.multi-select > summary { list-style: none; cursor: pointer; border: 1px solid var(--line); border-radius: var(--radius-s); padding: 0.45rem 2rem 0.45rem 0.6rem; background: var(--paper); }
.multi-select > summary::-webkit-details-marker { display: none; }
.multi-select > summary::after { content: '▾'; position: absolute; right: 0.6rem; top: 0.45rem; color: var(--ink-2); }
.multi-select[open] > summary { border-color: var(--accent); }
.ms-panel { position: absolute; left: 0; right: 0; top: calc(100% + 0.25rem); z-index: 20; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-s); padding: 0.4rem 0.6rem; display: flex; flex-direction: column; gap: 0.1rem; box-shadow: 0 6px 20px rgba(0,0,0,0.12); }
.back-row { margin: -0.2rem 0 0.8rem; }
.page { display: none; }
.page.is-active { display: block; }
.page-title { margin-bottom: 0.25rem; }
.page-lead { color: var(--ink-2); margin-bottom: 1.25rem; }

/* 按鈕：只有主按鈕有底色，其餘只有邊線 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
  border: 1px solid var(--line); background: var(--paper); color: var(--ink);
  padding: 0.55rem 1.1rem; border-radius: var(--radius-s);
  transition: background-color 120ms ease, border-color 120ms ease;
}
.btn:hover { background: var(--line-2); }
.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); padding: 0.7rem 1.6rem; font-weight: 500; }
.btn-primary:hover { background: #0b5b47; }
.btn-text { border-color: transparent; color: var(--accent); padding-left: 0.4rem; padding-right: 0.4rem; }
.btn-text:hover { background: var(--accent-soft); }
.btn-small { padding: 0.3rem 0.7rem; font-size: 0.88rem; }

/* 區塊 */
.card {
  background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-m);
  padding: 1.1rem 1.25rem; margin-bottom: 1rem;
}
.card-plain { background: var(--paper); padding: 0.4rem 0; margin-bottom: 1rem; }
.section-label { font-size: 0.8rem; color: var(--ink-3); letter-spacing: 0.04em; margin-bottom: 0.3rem; }
.divider { border: 0; border-top: 1px solid var(--line-2); margin: 1rem 0; }

/* 表單 */
fieldset { border: 0; padding: 0; margin: 0 0 1.4rem; min-width: 0; }
legend { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; padding: 0; margin-bottom: 0.6rem; border-left: 4px solid var(--accent); padding-left: 0.6rem; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 0.6rem 1rem; }
.field { display: flex; flex-direction: column; gap: 0.2rem; }
.field > span { font-size: 0.85rem; color: var(--ink-2); }
.field input[type="text"], .field input[type="number"], .field input[type="date"], .field select, .field textarea, .qa-input {
  border: 1px solid var(--line); border-radius: var(--radius-s); padding: 0.45rem 0.6rem; background: var(--paper);
}
.field input:focus, .field select:focus, .field textarea:focus, .qa-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.field.is-invalid input { border-color: var(--brick); }
.field-error { font-size: 0.82rem; color: var(--brick); }
.choice-row { display: flex; flex-wrap: wrap; gap: 0.4rem 1.1rem; }
.choice { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.2rem 0; white-space: nowrap; }
.choice input { width: 1.2rem; height: 1.2rem; accent-color: var(--accent); margin: 0; }
.choice-note { color: var(--ink-3); font-size: 0.85rem; }
.subhead { font-weight: 500; margin: 0.6rem 0 0.3rem; }
.inline-input, .field input.inline-input { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 0.1rem 0.3rem; min-width: 8rem; width: auto; background: transparent; }
.field input.inline-input { min-width: 0; width: 3.4rem; padding: 0.1rem 0.15rem; }
.field .choice-row { align-items: center; flex-wrap: nowrap; gap: 0.25rem; white-space: nowrap; }
.inline-input:focus { outline: 0; border-bottom-color: var(--accent); }
.inline-select { border: 1px solid var(--line); border-radius: var(--radius-s); padding: 0.2rem 0.3rem; background: var(--paper); font: inherit; font-size: 0.95rem; max-width: 8.5rem; }
.staff-only { color: var(--ink-3); }
.staff-only legend { border-left-color: var(--line); color: var(--ink-3); }
.form-prefilled { font-size: 0.85rem; color: var(--ink-2); background: var(--accent-soft); border-radius: var(--radius-s); padding: 0.5rem 0.8rem; margin-bottom: 1rem; }

/* 上傳示意 */
.dropzone {
  border: 2px dashed var(--line); border-radius: var(--radius-m); padding: 2rem 1rem;
  text-align: center; color: var(--ink-2); background: var(--paper);
}
.dropzone.is-loaded { border-style: solid; border-color: var(--accent); }
.bag-preview {
  margin: 0 auto 0.8rem; max-width: 380px; background: #fbfaf5; border: 1px solid #d9d3bd;
  text-align: left; padding: 0.9rem 1rem; font-size: 0.85rem; line-height: 1.5; color: #333;
  font-family: "Noto Sans TC", sans-serif;
}
.bag-preview .bag-head { display: flex; justify-content: space-between; border-bottom: 1px solid #d9d3bd; padding-bottom: 0.3rem; margin-bottom: 0.4rem; font-weight: 500; }
.bag-preview .bag-line { display: grid; grid-template-columns: 5.5rem 1fr; gap: 0.4rem; }
.progress { height: 8px; background: var(--line-2); border-radius: 999px; overflow: hidden; margin: 0.8rem 0 0.4rem; }
.progress > div { height: 100%; background: var(--accent); width: 0; transition: width 300ms linear; }
.tips { font-size: 0.88rem; color: var(--ink-2); }
.tips li { margin-bottom: 0.2rem; }

/* 確認頁 */
.med-card { border: 1px solid var(--line); border-radius: var(--radius-m); padding: 1rem 1.1rem; margin-bottom: 0.9rem; background: var(--paper); }
.med-card.is-confirmed { border-color: var(--accent); }
.med-head { display: flex; align-items: flex-start; gap: 0.6rem; flex-wrap: wrap; }
.med-name { font-family: var(--font-display); font-size: 1.25rem; font-weight: 600; }
.med-en { color: var(--ink-3); font-size: 0.85rem; }
.med-raw { color: var(--ink-2); font-size: 0.85rem; margin-top: 0.15rem; }
.tag { font-size: 0.78rem; padding: 0.1rem 0.55rem; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.tag-confirmed { border-color: var(--accent); color: var(--accent); }
.tag-source { border-color: transparent; background: var(--line-2); }
.tag-pending { border-color: var(--amber); color: var(--amber); background: var(--amber-soft); }
.tag-rx { border-color: var(--brick); color: var(--brick); }
.tag-otc { border-color: var(--accent); color: var(--accent); }
.kv { display: grid; grid-template-columns: 6rem 1fr; gap: 0.25rem 0.6rem; margin-top: 0.6rem; }
.kv dt { color: var(--ink-2); font-size: 0.9rem; }
.kv dd { margin: 0; }
.pending-box { background: var(--amber-soft); border-radius: var(--radius-s); padding: 0.6rem 0.8rem; margin-top: 0.5rem; }
.pending-box .choice-row { margin-top: 0.3rem; }
.med-actions { display: flex; gap: 0.5rem; margin-top: 0.8rem; flex-wrap: wrap; }

/* 講白話 */
.drug-hero { margin-bottom: 1rem; }
.drug-hero .med-name { font-size: 1.5rem; }
.drug-meta { color: var(--ink-2); font-size: 0.9rem; }
.speech-row { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; margin: 0.6rem 0 1rem; }
.speech-row label { font-size: 0.85rem; color: var(--ink-2); display: inline-flex; align-items: center; gap: 0.4rem; }
.speech-row input[type="range"] { width: 8rem; accent-color: var(--accent); }
.plain-section { margin-bottom: 1.1rem; }
.plain-section h3 { margin-bottom: 0.25rem; }
.plain-section p { white-space: pre-line; }
.plain-section p.kid { font-size: 1.08em; line-height: 1.85; }
mark { background: #ffe9a3; color: inherit; padding: 0 0.15em; border-radius: 3px; font-weight: 600; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.plain-full { margin: 0.35rem 0 0.4rem; }
.plain-full > summary { cursor: pointer; font-size: 0.85rem; color: var(--ink-2); }
.plain-full p { font-size: 0.9rem; color: var(--ink-2); margin-top: 0.3rem; }
.check-text label { line-height: 1.7; }
.check-orig { font-size: 0.82rem; color: var(--ink-3); margin-top: 0.15rem; line-height: 1.5; }
.plain-section.is-speaking { background: var(--accent-soft); margin-left: -0.6rem; margin-right: -0.6rem; padding: 0.4rem 0.6rem; border-radius: var(--radius-s); }
.cite-btn { border: 0; background: transparent; color: var(--accent); padding: 0; font-size: 0.85rem; text-decoration: underline; text-underline-offset: 3px; }
.cite-btn:hover { color: #0b5b47; }

.personal-note {
  border-left: 4px solid var(--accent); background: var(--accent-soft); padding: 0.7rem 0.9rem;
  border-radius: 0 var(--radius-s) var(--radius-s) 0; margin: 1rem 0; font-size: 0.95rem;
}
.personal-note strong { font-weight: 500; }

.checklist { list-style: none; margin: 0; padding: 0; }
.check-item { display: grid; grid-template-columns: auto 1fr; gap: 0.7rem; padding: 0.7rem 0; border-top: 1px solid var(--line-2); align-items: start; }
.check-item:first-child { border-top: 0; }
.check-item input { width: 1.45rem; height: 1.45rem; accent-color: var(--accent); margin-top: 0.2rem; }
.check-item .check-text { min-width: 0; }
.check-item .check-why { font-size: 0.82rem; color: var(--accent); margin-top: 0.15rem; }
.check-item.is-related .check-text::before { content: "與您有關 "; font-size: 0.78rem; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 0 0.45rem; margin-right: 0.4rem; vertical-align: 2px; }
.check-item.is-unchecked { background: var(--amber-soft); margin: 0 -0.5rem; padding-left: 0.5rem; padding-right: 0.5rem; }
.skipped-summary { font-size: 0.85rem; color: var(--ink-2); margin-top: 0.6rem; }
.skipped-summary summary { cursor: pointer; color: var(--accent); }
.skipped-summary ul { margin: 0.3rem 0 0; padding-left: 1.2rem; }
.skipped-summary li { margin-bottom: 0.25rem; }
.checklist-status { font-size: 0.85rem; color: var(--ink-2); margin-top: 0.4rem; }
.checklist-status[data-done="true"] { color: var(--accent); }

.followup { border-top: 1px solid var(--line-2); padding: 0.8rem 0; }
.followup:first-of-type { border-top: 0; }
.followup .q { font-weight: 500; }
.followup .q small { display: block; font-weight: 400; color: var(--ink-2); font-size: 0.85rem; }
.followup .choice-row { margin-top: 0.35rem; }
.followup-alert { margin-top: 0.5rem; padding: 0.55rem 0.8rem; background: var(--amber-soft); border-radius: var(--radius-s); font-size: 0.92rem; }
.followup.is-unanswered { background: var(--amber-soft); margin: 0 -0.5rem; padding-left: 0.5rem; padding-right: 0.5rem; }

/* 交互作用 */
.pair-card { border: 1px solid var(--line); border-radius: var(--radius-m); padding: 1rem 1.1rem; margin-bottom: 0.9rem; background: var(--paper); }
.pair-names { font-family: var(--font-display); font-size: 1.15rem; font-weight: 600; }
.sev { display: inline-block; font-size: 0.8rem; padding: 0.1rem 0.6rem; border-radius: 999px; margin-left: 0.4rem; vertical-align: 3px; }
.sev-moderate { background: var(--amber-soft); color: var(--amber); }
.sev-severe { background: var(--brick-soft); color: var(--brick); }
.sev-none { background: var(--line-2); color: var(--ink-2); }
.evidence { margin-top: 0.6rem; }
.evidence summary { cursor: pointer; color: var(--accent); font-size: 0.9rem; }
.evidence blockquote { margin: 0.5rem 0 0; padding: 0.5rem 0.8rem; border-left: 3px solid var(--line); color: var(--ink-2); font-size: 0.88rem; white-space: pre-line; }
.evidence .who { font-size: 0.8rem; color: var(--ink-3); margin-top: 0.4rem; }
.honest { color: var(--ink-2); font-size: 0.92rem; }

/* 測驗 */
.quiz-q { border-top: 1px solid var(--line-2); padding: 0.9rem 0; }
.quiz-q:first-child { border-top: 0; }
.quiz-q .q-title { font-weight: 500; }
.quiz-q .q-title small { color: var(--ink-3); font-weight: 400; margin-right: 0.4rem; }
.quiz-q .choice-row { flex-direction: column; gap: 0.15rem; margin-top: 0.35rem; }
.quiz-q.is-correct .q-title::after { content: " 答對了"; color: var(--accent); font-size: 0.85rem; }
.quiz-q.is-wrong .q-title::after { content: " 再想想"; color: var(--brick); font-size: 0.85rem; }
.quiz-q.is-wrong { background: var(--brick-soft); margin: 0 -0.5rem; padding-left: 0.5rem; padding-right: 0.5rem; }
.quiz-explain { font-size: 0.88rem; color: var(--ink-2); margin-top: 0.3rem; }
.quiz-result { padding: 0.9rem 1rem; border-radius: var(--radius-s); margin-top: 1rem; }
.quiz-result[data-pass="true"] { background: var(--accent-soft); color: var(--accent); }
.quiz-result[data-pass="false"] { background: var(--brick-soft); color: var(--brick); }
.score { font-family: var(--font-display); font-size: 1.6rem; font-weight: 600; }

/* 提醒與打卡 */
.dose-row { display: grid; grid-template-columns: 4.2rem 1fr auto; gap: 0.6rem; align-items: center; padding: 0.7rem 0; border-top: 1px solid var(--line-2); }
.dose-row:first-child { border-top: 0; }
.dose-time { font-family: var(--font-display); font-size: 1.15rem; font-weight: 600; }
.dose-name { font-weight: 500; }
.dose-sub { color: var(--ink-2); font-size: 0.88rem; }
.dose-actions { display: flex; gap: 0.35rem; flex-wrap: wrap; justify-content: flex-end; }
.status { font-size: 0.8rem; padding: 0.05rem 0.5rem; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); }
.status[data-s="taken"] { border-color: var(--accent); color: var(--accent); }
.status[data-s="missed"] { border-color: var(--brick); color: var(--brick); }
.status[data-s="snoozed"], .status[data-s="skipped"] { border-color: var(--amber); color: var(--amber); }
.reminder-card {
  position: fixed; top: 1rem; left: 50%; transform: translateX(-50%); z-index: 30;
  width: min(92vw, 440px); background: var(--ink); color: var(--paper); border-radius: var(--radius-m);
  padding: 0.9rem 1.1rem; box-shadow: 0 8px 24px rgba(0,0,0,0.25);
}
.reminder-card .r-title { font-family: var(--font-display); font-size: 1.15rem; font-weight: 600; }
.reminder-card .r-body { font-size: 0.95rem; opacity: 0.9; }
.reminder-card .dose-actions { margin-top: 0.6rem; justify-content: flex-start; }
.reminder-card .btn { background: transparent; color: var(--paper); border-color: rgba(255,255,255,0.4); }

.schedule-note { font-size: 0.85rem; color: var(--ink-2); }

/* 報表 */
.big-stat { display: flex; align-items: baseline; gap: 0.6rem; }
.big-stat .n { font-family: var(--font-display); font-size: 2.6rem; font-weight: 600; line-height: 1; }
.big-stat .l { color: var(--ink-2); }
.stat-line { color: var(--ink-2); font-size: 0.95rem; }

.bar > div { height: 100%; background: var(--accent); }
.bar.is-miss > div { background: var(--brick); }
.week-grid { display: grid; grid-template-columns: 5rem repeat(7, 1fr); gap: 0.25rem; font-size: 0.82rem; margin-top: 0.6rem; }
.week-grid .h { color: var(--ink-3); text-align: center; }
.week-grid .cell { height: 1.6rem; border-radius: var(--radius-s); background: var(--line-2); }
.week-grid .cell[data-s="taken"] { background: var(--accent); }
.week-grid .cell[data-s="missed"] { background: var(--brick); }
.week-grid .cell[data-s="pending"] { background: var(--paper); border: 1px dashed var(--line); }
.week-grid .rowlabel { align-self: center; }

/* 藥箱 */
.cab-item { display: grid; grid-template-columns: 1fr auto; gap: 0.5rem; padding: 0.8rem 0; border-top: 1px solid var(--line-2); align-items: start; }
.cab-item:first-child { border-top: 0; }
.cab-name { font-weight: 500; }
.cab-sub { font-size: 0.88rem; color: var(--ink-2); }
.expiry { font-size: 0.85rem; }
.expiry[data-tone="soon"] { color: var(--amber); }
.expiry[data-tone="expired"] { color: var(--brick); }
.expiry[data-tone="ok"] { color: var(--ink-2); }
.dup-banner { background: var(--amber-soft); border-radius: var(--radius-s); padding: 0.6rem 0.8rem; margin-bottom: 0.8rem; font-size: 0.92rem; }
.steps-list { padding-left: 1.3rem; }
.steps-list li { margin-bottom: 0.3rem; }
.dont-list { padding-left: 1.3rem; color: var(--brick); }
.dont-list li { margin-bottom: 0.3rem; }

/* 家人照護 */
.rel-row { display: flex; align-items: center; gap: 0.7rem; padding: 0.6rem 0; border-top: 1px solid var(--line-2); flex-wrap: wrap; }
.rel-row:first-child { border-top: 0; }
.rel-name { font-weight: 500; }
.rel-perm { font-size: 0.85rem; color: var(--ink-2); }
.rel-row .btn-text { margin-left: auto; }
.rel-main { display: flex; flex-direction: column; gap: 0.1rem; }
.rel-phone { display: inline-flex; align-items: center; gap: 0.4rem; font-family: var(--font-display); font-size: 1.05rem; font-weight: 600; }
.switch { display: inline-flex; align-items: center; gap: 0.5rem; }
.switch input { width: 1.3rem; height: 1.3rem; accent-color: var(--accent); }
.notif-demo { background: var(--ink); color: var(--paper); border-radius: var(--radius-m); padding: 0.8rem 1rem; margin-top: 0.8rem; }
.notif-demo .n-app { font-size: 0.75rem; opacity: 0.7; }
.invite-code { font-family: "Courier New", monospace; font-size: 1.6rem; letter-spacing: 0.15em; margin: 0.3rem 0; }

.chat-log { display: flex; flex-direction: column; gap: 0.7rem; margin-bottom: 1rem; }
.msg { max-width: 92%; padding: 0.65rem 0.9rem; border-radius: var(--radius-m); }
.msg-user { align-self: flex-end; background: var(--ink); color: var(--paper); }
.msg-bot { align-self: flex-start; background: var(--paper); border: 1px solid var(--line); }
.msg-bot .refuse { color: var(--brick); }
.msg-bot .basis { font-size: 0.8rem; color: var(--ink-3); margin-top: 0.4rem; }
.msg-bot .basis span { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 0 0.45rem; margin-right: 0.3rem; margin-top: 0.2rem; }
.msg-bot p { white-space: pre-line; }
.msg-thinking { color: var(--ink-3); font-style: normal; }
.qa-form { display: flex; gap: 0.5rem; align-items: flex-end; }
.qa-input { flex: 1; min-height: 3rem; resize: vertical; }
.quick-qs { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.8rem; }
.quick-qs button { font-size: 0.88rem; }
.chat-scope { font-size: 0.85rem; color: var(--ink-2); margin-bottom: 0.8rem; }
.qa-layout { display: grid; grid-template-columns: 15rem minmax(0, 1fr); gap: 1rem; align-items: start; }
.qa-history { border: 1px solid var(--line); border-radius: var(--radius-m); padding: 0.7rem 0.5rem; background: var(--paper); position: sticky; top: 4.5rem; max-height: 75vh; overflow: auto; }

.qa-history h3 { margin: 0; font-size: 0.95rem; }
.qa-history ul { list-style: none; margin: 0; padding: 0; }
.qa-history li { display: flex; align-items: stretch; border-radius: var(--radius-s); }
.qa-history li.is-current { background: var(--line-2); }
.qa-history li:hover { background: var(--line-2); }
.qa-history .s-open { flex: 1; min-width: 0; text-align: left; border: 0; background: transparent; padding: 0.45rem 0.5rem; font-size: 0.9rem; line-height: 1.35; border-radius: var(--radius-s); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.qa-history .h-date { display: block; font-size: 0.75rem; color: var(--ink-3); }
.status[data-s="prn"] { color: var(--ink-2); }
@media (max-width: 720px) {
  .qa-layout { grid-template-columns: 1fr; }
  .qa-history { position: static; max-height: 11rem; }
}
@media (max-width: 600px) {
  html { font-size: 17px; }
  .dose-row { grid-template-columns: 3.6rem 1fr; }
  .dose-row .dose-actions { grid-column: 1 / -1; justify-content: flex-start; }
  .kv { grid-template-columns: 5rem 1fr; }
  .week-grid { grid-template-columns: 3.6rem repeat(7, 1fr); }
}

/* 新增藥品（真實辨識與搜尋） */
label.btn { display: inline-flex; align-items: center; cursor: pointer; }
.bag-photo { max-width: 100%; max-height: 320px; border-radius: var(--radius-s); display: block; margin: 0 auto 0.5rem; }
.search-row { display: flex; gap: 0.5rem; align-items: stretch; flex-wrap: wrap; }
.search-row .qa-input { min-height: 2.6rem; flex: 1 1 12rem; }
.search-results { list-style: none; margin: 0.6rem 0 0; padding: 0; }
.search-item { display: flex; align-items: center; gap: 0.6rem; padding: 0.55rem 0; border-top: 1px solid var(--line-2); }
.search-item:first-child { border-top: 0; }
.search-item > div { flex: 1; min-width: 0; }
.search-item.is-dim .med-name { color: var(--ink-3); }
.progress-card .steps-list li[data-s="doing"] { color: var(--accent); font-weight: 500; }
.progress-card .steps-list li[data-s="done"] { color: var(--ink-3); text-decoration: line-through; }
.progress-card .steps-list li[data-s="fail"] { color: var(--brick); }
.caregiver-entry { margin-top: 1.2rem; text-align: center; }

/* 交互作用與問答：仿單 vs AI 補充 */
.tag-ai { background: var(--amber-soft); color: var(--amber); border-color: var(--amber); margin-left: 0.4rem; }
.ai-note { font-size: 0.85rem; color: var(--amber); }
.src-block { margin-top: 0.6rem; padding: 0.5rem 0.7rem; border-radius: var(--radius-s); font-size: 0.9rem; }
.src-block ul { margin: 0.2rem 0 0; padding-left: 1.1rem; }
.src-block li { margin-bottom: 0.15rem; }
.src-title { font-weight: 600; font-size: 0.82rem; }
.src-leaflet { background: var(--accent-soft); }
.src-leaflet .src-title { color: var(--accent); }
.src-ai { background: var(--amber-soft); }
.src-ai .src-title { color: var(--amber); }
.src-who { display: inline-block; margin-left: 0.4rem; font-size: 0.78rem; color: var(--ink-3); }
.week-grid .cell[data-s="none"] { background: transparent; border: 1px dotted var(--line); }

</style>
</head>

    "plainWhenToSeekCare": "這類藥物偶爾會引起「血管性水腫」，也就是臉部、四肢、嘴唇、舌頭、聲門或喉部腫起來。和喉部水腫有關的血管性水腫有致命危險；若出現喉嚨發出喘鳴聲，或是臉部、舌頭、聲門腫脹，應停止服藥並立即接受適當治療。\n\n若出現黃疸（皮膚或眼白變黃）或肝臟酵素明顯升高，應停止服用並接受適當的醫療追蹤，因為極少數肝衰竭的案例和這類藥物有關。另外，本身有嚴重冠狀動脈阻塞的人，在開始服用鈣離子阻斷劑或增加劑量時，心絞痛和／或心肌梗塞的發生次數、持續時間或嚴重度可能增加，不過機會很低。\n\n本藥也可能造成血壓過低，尤其是長期使用利尿劑、飲食限鹽、洗腎、腹瀉或嘔吐而流失鹽分與體液的人。心衰竭嚴重的人使用這類藥物，可能出現尿量減少、血中含氮廢物升高、急性腎衰竭，甚至死亡。任何上述情形，請立即就醫。"

    "plainHowToTake": "發燒或需要時服用。若症狀持續，每 4 到 6 小時可以再服用一次，但 24 小時內不可以超過 4 次。\n\n成人每次 1 錠，12 歲以上的人使用成人劑量；6 歲以上但未滿 12 歲，用成人劑量的一半（1/2 錠）；3 歲以上但未滿 6 歲，用成人劑量的四分之一（1/4 錠）；未滿 3 歲的嬰幼兒請找醫師診治，不宜自行使用。\n\n服用這類藥品三天後，如果發燒、疼痛沒有改善，應停藥並就醫。成人不可以連續服用超過 7 天，小孩不可以超過 3 天；如果情況需要繼續服用，請先詢問醫師。\n\n請勿超過建議劑量。大部分發生肝臟損害的情況，是因為一天使用超過 4,000 毫克的乙醯胺酚，而且多半是同時吃了一種以上含有這個成分的藥品。有些人是為了讓止痛效果更好而吃過量，也有人是在不知情的狀況下，同時吃了其他同樣含有乙醯胺酚的藥，因而造成用藥過量。請您注意藥品標示上是否含有 acetaminophen 或 paracetamol 成分，不可以同時使用超過一種含有這個成分的藥品。\n\n為防止兒童誤食，請妥善保管。避免陽光直射，宜存放在陰涼的地方。",

   "id": "58603",
   "licenseNo": "衛部藥製字第059395號",

   "start": 1415,
   "text": "【警語】（參考文獻）\n雙重阻斷腎素-血管昇壓素-醛固酮系統( rennin-angiotensin-aldosterone system,RAAS ) :\n有證據顯示,合併使用 ACEIs、ARBs或含aliskiren成分藥品倉增加低血壓、高鉀血症及腎功\n能下降(包括急性腎衰竭)之風險，故不建議合併使用ACEIs、ARBs或aliskiren成分藥品來雙\n重阻斷RAAS，若確有必要使用雙重阻斷治療，應密切監測患者之腎功能、電解質及血壓。\nACEIs 及 ARBs 不應合併使用於糖尿病腎病變患者。\n甘露醇\n本品因含有甘露醇（Mannitol）賦形劑，因此對甘露醇（Mannitol）過敏之病患宜請告知醫\n師或藥師。\n類過敏反應\n由於 ACEI 會影響 eicosanoid 和 polypeptides（包括內生性的 bradykinin）的代謝，病人\n接受 ACEI 治療時，可能會產生輕微到嚴重不同的副作用，這些副作用通常會在前幾次給藥\n後發生，但有時在治療好幾個月後也不會發生。\n血管性水腫：使用 ACEI 偶爾會引起血管性水腫，包括：臉部、四肢、嘴唇、舌頭、聲門和\n喉頭。在美國的臨床試驗中發現，接受安慰劑對照的個案沒有人有血管性水腫的症狀，而\n接受 benazepril 的病人約有 0.5%的個案會發生；和喉頭水腫有關的血管性水腫有致命的危\n險；若發生喉頭性喘鳴或臉部、舌頭或聲門有血管性水腫，則應停止服用本品並立即給予\n適當的治療；當血管性水腫發生在舌頭、聲門或喉頭處且疑似造成呼吸道阻塞，應即時給\n予適當的治療，例如：subcutaneous epinephrine 注射劑 1：1,000（0.3 ~ 0.5 mL）（請參\n閱〔不良反應〕）。\n抗敏感治療之類過敏反應：2 位病人因接受 ACEI 造成持續威脅生命的類過敏反應而接受以\nhymenoptera venom 之抗過敏反應治療。\n透析膜接觸之相關過敏反應：服用 ACEI 之洗腎患者，使用 high-flux membranes 透析可能\n會有類似過敏反應發生。類似過敏性反應曾發生於以吸收 dextran sulfate 接受低密度脂蛋\n白血漿分離治療的病人。\n增加心絞痛和∕或心肌梗塞：當病人特別患有嚴重阻塞性冠狀動脈疾病，在開始服用鈣離\n子阻斷劑治療或增加劑量時，會增加發生心絞痛和∕或心肌梗塞的頻率、期間和/或嚴重度\n。但發生的機會很低，且發生此作用的機制並不明確。\n低血壓\n本品會造成全身性低血壓，如同其他的 ACEI，benazepril 對於單純高血壓病人造成全身性\n低血壓的機會極低；全身性低血壓較易發生在因長期使用利尿劑、控制飲食鹽分、洗腎、\n腹瀉或嘔吐而導致流失鹽份或體液的病人身上。在使用本品治療前，應先補充流失的體液\n及鹽分。\n由於 amlodipine 的血管舒張作用是漸漸發生，因此在口服 amlodipine 之後，急性低血壓發\n生的機會極少；然而，當本品和其他週邊血管舒張劑合併使用時應特別小心，尤其在嚴重\n主動脈瓣狹窄的病人身上。\n不管和腎功能不全有沒有關係，對於充血性心衰竭病人，以 ACEI 治療可能會造成過度低血\n壓而導致少尿症、氮血症和急性腎功能衰竭或死亡（極少），此類病人於接受本品時應在\n嚴密的醫療監護下，在治療的前 2 週應嚴密追蹤，另外當 benazepril 劑量增加或利尿劑加\n入治療或劑量增加時，也應密集追蹤。當低血壓發生時，病人應採仰臥姿勢，必要時應給\n予生理食鹽水靜脈注射；當血壓及體液恢復後，通常可繼續使用本品。\n嗜中性白血球缺乏症∕顆粒性白血球缺乏症\n已有資料顯示另一個 ACEI captopril 會造成顆粒性白血球缺乏症和骨髓抑制，在單純的高\n血壓患者發生率較低（<1/10,000），在腎功能不全患者發生率較高（>1/10,000），尤其\n在有膠原血管性疾病患者身上，例如：全身性紅斑性狼瘡或硬皮病等。benazepril 的臨床\n試驗數據並不足以顯示 benazepril 不會造成和 captopril 相似的顆粒性白血球缺乏症；對於\n膠原血管性疾病的患者，應隨時監看白血球計數，尤其當疾病與腎功能不全有關時。\n胎兒∕新生兒發病率和死亡率\n全世界的文獻報告中，許多病例顯示懷孕婦女服用 ACEI 會造成胎兒罹病或死亡，因此當婦\n女已知懷孕時，應儘早停止服藥。在懷孕第二、三期時，使用 ACEI 會導致胎兒及新生兒損\n傷，包括：低血壓、頭蓋骨發育不全、無尿、可回復或不可回復之腎衰竭及死亡，另外胎\n兒腎功能降低可能會造成無羊水的情形發生；oligohydramnios 和胎兒四肢緊縮變形、顱面\n畸形和肺發育不全有關，也曾有報告指出有子宮成長遲緩和永久性動脈管的情形發生，但\n並不確定是否和使用 ACEI 有關。若母親於懷孕第一期服用 ACEI，並不會有以上副作用發\n生，但仍應告知患者；雖然如此，當病人懷孕時，醫師仍應儘早停止給予 benazepril；在\n極少數（每 1,000 名孕婦少於 1 名）必須接受 ACEI 的病例中，應告知這些孕婦胎兒可能會\n發生的危害，且應定期接受超音波檢查以評估羊膜內環境。若發現 oligohydramnios 產生，\nbenazepril 應停止服用，除非必須依賴 benazepril 以維持母親的生命，Contraction stress\ntest（CST）、a nonstress test（NST）或 biophysical profiling（BPP）應視懷孕週數適當\n執行；病人和醫師應該了解到 oligohydramnios 不一定會出現，除非已造成胎兒持續性不可\n逆之傷害。嬰兒在子宮內若有暴露到 ACEI 應隨時注意有無低血壓、尿少症及高血鉀症發生\n【成分】Each tablet contains：Amlodipine (as besylate) ...5 mg Benazepril hydrochloride...10 mg\n【成份組成】\n本品為 amlodipine besylate 和 benazepril hydrochloride 之複方口服錠劑，每錠含 amlodipine\nbesylate（相等於 amlodipine 5 mg）和 benazepril hydrochloride 10 mg。\nAmlodipine besylate 是一種白色至微黃色結晶狀粉末，微溶於水且僅少量溶於乙醇；Amlodipine\nbesylate 是 amlodipine 的 besylate 鹽類，是\n一種鈣離子通道阻斷劑。\nAmlodipine besylate 的 化 學 名 為 (R,S)3-\nethyl-5- methyl-2-(2-aminoethoxymethyl)\n-4-(2-chlorophenyl)-1,4-dihydro-6- methyl-\n3,5-pyridinedicarboxylatebenzenesulfonate，\n實驗式為 C20H25ClN2O5．C6H6O3S，分子量\n為 567.1，結構式如右\nBenazepril hydrochloride 是一種白色至灰\n白 色 結 晶 狀 粉 末 ， 可 溶 於 水 ( > 100\nmg/mL)、乙 醇 和甲 醇 ，其 活 性代 謝物\nBenazeprilat，是一種非硫氫根血管緊縮素轉換酵素抑制劑（ACEI）。\nBenazepril hydrochloride 的化學名為 3-[[1[(ethoxycarbonyl)-3-phenyl-(1S)-propyl]amino]-2,3,4,5-\ntetrahydro-2-oxo-1H-1-(3S)-benzazepine-1-acetic acid monohydrochloride，它的實驗式為 C24H28N2O5\n．HCl，分子量為 460.96，結構式如右下"
  },

   "text": "【適應症】\n高血壓。\n此複方藥物不宜用於高血壓的初始\n治療(請參閱〔使用方法、劑量〕，\n並依醫師處方使用)。\n服用時須特別注意 ACEI 易造成顆\n粒性白血球缺乏症，尤其是腎功能\n不全或膠原血管性疾病患者（collagen-vascular disease）；另外對於 benazepril 也沒有足夠的\n證據顯示沒有此相似的危險（請參閱〔警語〕中「嗜中性白血球∕顆粒性白血球」）。\n【使用方法、劑量】（本藥須由醫師處方使用）\n治療高血壓的有效劑量 amlodipine 為每天 2.5 ~ 10 mg，benazepril 為每天 10 ~ 80 mg。在以\namlodipine 2.5 ~ 5 mg 和 benazepril 10 ~ 20 mg 合併治療的臨床試驗中，對所有病人群降血壓的\n效果會隨 amlodipine 的劑量而增加，在非黑人中，降血壓的效果也會隨 benazepril 的劑量而\n增加。對所有病人減少由 amlodipine 所引起的水腫。\nBenazepril 的危害通常和劑量無關，但 amlodipine 的危害有的和劑量有關（周邊血管性水腫\n）也有的和劑量無關，但與劑量有關的較常見。當 benazepril 加入與 amlodipine 合併使用，\n水腫的發生率會降低，因此雖然 amlodipine 和 benazepril 合併治療會兼有兩者與劑量無關的\n副作用，但其水腫發生率比以 amlodipine 單獨治療來得低。\n為了減少服用本複方藥物所帶來的危害，建議僅在以下情況時得以治療，且不宜使用於高\n血壓的初始治療（1）以單一降血壓藥物治療無效，（2）以 amlodipine 治療未達預期效果且\n無水腫現象發生。治療置換：為了方便，原本使用 amlopdipine 及 benazepril 兩錠合併治療的病人，可改用一錠\n含有與原先使用相同劑量之 Co-Amndiline。用於代謝不全病人：當病人肌胺酸酐廓清率大於 30 mL/min/1.73 m2 時（約相當於血清肌胺酸\n酐濃度≦3 mg/dL 或 265 μ mol/L），不必調整本品的劑量；當病人嚴重腎功能不全時，\nbenazepril 的建議起始劑量為 5 mg，Co-Amndiline 則不建議使用。\n對年幼、年老、虛弱及肝功能受損的病人，對單一治療及合併治療，Amlodipine 的建議起始\n劑量為 2.5 mg。\n【臨床藥理】（參考文獻）作用機轉\n血管平滑肌和心肌的收縮必須經由特殊離子通道將細胞外的鈣離子往這些細胞內傳送，而\namlodipine 是一種鈣離子拮抗劑，可以抑制鈣離子通過細胞膜往血管平滑肌和心肌的流動，\n但此種抑制具有選擇性，對於血管平滑肌的作用較心肌來得大；另外，血清鈣離子濃度不\n會被 amlodipine 影響。在正常生理 pH 值範圍內，amlodipine 是離子型態化合物（pKa=8.6）\n，它和鈣離子通道受體的結合和解離速率是漸進的，因此所造成的效果也是漸進的。\nAmlodipine 是一種周邊動脈血管擴張劑，可以直接作用於血管平滑肌，造成周邊血管阻力降\n低及血壓降低。\n在人體和動物中，benazepril 和 benazeprilat 可以抑制血管緊縮素轉換酵素（ACE），而 ACE\n可將血管緊縮素I轉變為血管緊縮素II，其為血管收縮劑物質；血管緊縮素II也可刺激腎\n上腺皮質分泌醛類脂醇（aldosterone）。抑制 ACE 會使血漿中血管緊縮素II濃度降低，導致\n血管收縮活性降低及醛類脂醇分泌減少，後者則會導致血中鉀離子濃度微量增加；高血壓\n病人以 benazepril 和 amlodipine 治療 56 週，血中鉀離子濃度升高至 0.2 mEq/L。將血管緊縮素\nII對腎活素分泌的負回饋移除會導致血漿的腎活素增加；在動物實驗中，benazepril 對於血\n管緊縮素II的血管加壓神經反應（vasopressor response）並沒有抑制作用，另外對於乙醯膽鹼\n、腎上腺素和副腎上腺素等神經傳導物質的血液動力學亦沒有影響。一般相信 benazepril 降\n血壓的作用機轉為抑制腎活素-血管緊縮素-醛類脂醇（renin-angiotensin-aldosterone）系統，因\n此即使是低腎活素之高血壓病人，benazepril 依然有降血壓的效果。藥物動力學\n根據國外臨床研究顯示，複方 benazepril 和 amlodipine 在體內的吸收速率和程度與分別單方\n投與並沒有顯著的差異。各別單方投與，其吸收不會被腸胃道中的食物所影響，複方則無\n食物影響的研究報告。服藥後，血漿 benazepril 濃度於 0.5 ~ 2 小時到達高峰，酯基裂解（主\n要於肝臟）轉換為活性代謝物（benazeprilat），其代謝物 benazeprilat 之血漿濃度於 1.5 ~ 4 小\n時到達高峰，benazepril 的吸收程度至少 37%。血漿 amlodipine 濃度於 6 ~ 12 小時到達高峰，\n吸收程度約為 64% ~ 90%。\nAmlodipine 和 benazeprilat 的分佈體積分別為 21 L/kg 和 0.7 L/kg，體內循環中約有 93%的\namlodipine 和血漿蛋白結合，benazeprilat 的結合比例較 amlodipine 稍高。體外實驗研究發現\n，benazeprilat 的蛋白結合程度不會被濃度、年齡和肝功能所影響。\nBenazeprilat 對 ACE 抑制活性遠大於 benazepril，且 benazepril 幾乎完全代謝成 benazeprilat，尿\n液排出中僅少量為原型，約 20%為 benazeprilat，8%為 benazeprilat glucuronide，4%為 benazepril\nglucuronide。Amlodipine 大多經由肝臟代謝，10%以原型、60%以其代謝物排於尿中。肝功能\n不全患者，因 amlodipine 的清除率降低導致血漿濃度曲線下面積約增加 40% ~ 60%，因此劑\n量必須適量調降（請參閱〔使用方法、劑量〕）。腎功能不全患者，amlodipine 的藥物動力\n學不會被影響。\nBenazeprilat 和 amlodipine 的有效排除半衰期分別約 10 ~ 11 小時和 2 天，每天給藥一次持續\n一星期後，此兩種藥物可達穩定狀態的血中濃度。Benazeprilat 從血漿的清除主要經由腎臟\n，但在正常人，膽汁排除約佔 benazepril 排泄的 11% ~ 12%。對於腎功能不全患者（肌氨酐\n酸廓清低於 30 mL/min），benazeprilat 到達高峰的濃度和到達穩定狀態的時間可能會增加（\n請參閱〔使用方法、劑量〕）；對於肝功能不全的患者，benazeprilat 的藥物動力學不會改變\n。年齡不會影響 Benazepril 和 benazeprilat 的藥物動力學，而 amlodipine 在老人的清除率會下\nP1\n，若有尿少症發生，應注意須提升血壓和腎臟灌注；若要使低血壓或腎功能恢復正常，可\n能必須換血或做腹膜透析。通過胎盤的 benazepril 理論上可經由上述之方法從胎兒血液循\n環中去除，但臨床上此類經驗仍非常有限。\n至 今 仍 沒 有 在 孕 婦 做 有 關 此 複 方 藥 物 的 臨 床 研 究 報 告 。 在 動 物 試 驗 中 ， 當 給 予 大 鼠\nbenazepril：amlodipine 劑量從 5：2.5 到 50：25 mg/kg/day，會產生難產的情形且劑量愈\n高發生率會愈高。以 mg/m2\n計算，amlodipine 2.5 mg/kg/day 劑量是 50 公斤婦女最大建議\n劑量的 3.6 倍；benazepril 5 mg/kg/day 劑量是 50 公斤婦女最大建議劑量的將近 2 倍。給\n予懷孕的大鼠或兔子 benazepril 和 amlodipine 合併治療，並沒有畸形胎的情形出現，大鼠\n接受的劑量為 50：25 mg/kg/day（benazepril：amlodipine）（以 mg/m2\n計算，為 50 公斤\n婦女最大建議劑量的 24 倍）；兔子接受的劑量為 1.5：0.75（benazepril：amlodipine）（\n以 mg/m2 計算，為 50 公斤婦女最大建議劑量的 0.97 倍）。在單獨使用 benazepril 或\namlodipine 的動物研究中也有相似的結果。肝衰竭\n有極少數的肝衰竭個案和 ACEI 有關，其症狀從膽汁鬱滯性黃疸開始惡化到纖維性肝壞死有\n時甚至會死亡，此症狀的機轉並不清楚；當接受 ACEI 的病人發展成黃膽或肝臟酵素明顯升\n高，應停止服用 ACEI 並接受適當的醫療追蹤。\n至今仍沒有在孕婦做有關此複方藥物的臨床研究報告。在動物試驗中，當給予大鼠 benazepril\n：amlodipine劑量從 5：2.5到 50：25 mg/kg/day，會產生難產的情形且劑量愈高發生率會愈高。\n以mg/m2 計算，amlodipine 2.5mg/kg/day劑量是50公斤婦女最大建議劑量的3.6倍；benazepril\n5mg/kg/day劑量是50公斤婦女最大建議劑量的將近2倍。給予懷孕的大鼠或兔子benazepril 和\namlodipine 合併治療，並沒有畸形胎 的情形出現，大鼠接受的劑量為 50：25 mg/kg/day\n(benazepril：amlodipine)(以 mg/m2 計算，為 50公斤婦女最大建議劑量的24倍)；兔子接受的\n劑量為1.5：0.75(benazepril：amlodipine)(以mg/m2 計算，為50 公斤婦女最大建議劑量的0.97\n倍)。在單獨使用 benazepril 或 amlodipine 的動物研究中也有相似的結果。肝衰竭\n有極少數的肝衰竭個案和 ACEI 有關，其症狀從膽汁鬱滯性黃疸開始惡化到纖維性肝壞死有\n時甚至會死亡，此症狀的機轉並不清楚；當接受 ACEI 的病人發展成黃膽或肝臟酵素明顯升\n高，應停止服用 ACEI 並接受適當的醫療追蹤。"

   "text": "【注意事項】（參考文獻）一般事項\n腎功能不全患者：患有嚴重腎臟疾病的病人應小心使用本藥。對於易感性強的病人，可預\n期當腎活素-血管緊縮素-醛類脂醇系統被 benazepril 抑制時，腎臟功能會跟著改變；對於嚴\n重的充血性心衰竭病人，其腎功能必須依賴腎活素-血管緊縮素-醛類脂醇系統的運作，因此\n以 ACEI（包括 benazepril）治療可能會造成尿少症、氮血症及急性腎衰竭或死亡。在少數\n對於單側或雙側腎動脈狹窄病人的研究中發現，以 benazepril 治療會使血中尿素氮和血清\n肌氨酐酸濃度升高，但若停止服用 benazepril 或合併利尿劑治療，則可使血中尿素氮和血\n清肌氨酐酸濃度恢復正常，若此類病人須接受本藥治療，前幾個星期應隨時監測腎臟功能\n。沒有明顯腎血管疾病症狀的高血壓病人，以 benazepril 治療會增加血中尿素氮和血清肌\n氨酐酸濃度，但通常是輕微且暫時的，尤其當 benazepril 和利尿劑合併治療時。對於高血\n壓病人的評估應包括腎功能之評估（請參閱〔使用方法、劑量〕）。高血鉀症：在美國以安慰劑對照的臨床試驗發現，約有 1.5%的高血壓病人在服用同類複方\n藥物之後發生高血鉀症，但血清中升高的鉀離子濃度通常是可回復的；會發生高血鉀症的\n危險因子包括：腎功能不全、糖尿病及合併使用留鉀利尿劑、鉀離子補充劑或含鉀離子的\n鹽類物質。充血性心衰竭：雖然在美國針對 NYHA Class II ~ III心衰竭病人的血液動力學和臨床研究\n均顯示 amlodipine 並不會導致以運動容忍度測量之臨床上的惡化、左心室的排斥和臨床症\n狀上的改變，但仍沒有研究是針對 NYHA Class IV心衰竭病人。總之，對於心衰竭的病人\n均應小心使用所有鈣離子通道阻斷劑類藥物。肝衰竭：在因肝硬化導致肝功能不全的病人，體內 benazeprilat 的濃度不會改變，但因為\namlodipine 由肝臟代謝，且在肝功能不全的病人其血漿排除半衰期長達 56 小時，所以若肝\n臟嚴重受損的病人服用本品時應特別注意（請參閱〔警語〕）。咳嗽：由於 ACEI 會抑制內生性 bradykinin 的分解，因此易造成持續性的乾咳，但在停止\n服用後即可回復正常；醫師診斷時應注意須將因 ACEI 引起的咳嗽和一般咳嗽有所區別。手術∕麻醉：當病人在進行手術或於麻醉期間有使用會造成低血壓的製劑，benazepril 會\n阻斷血管緊縮素II的合成，造成腎活素的代償性釋放，若是由此機制所造成的低血壓可以\n補充體液來恢復。藥物交互作用\n臨床試驗數據顯示，相較於使用單一作用於RAAS之藥品，合併使用ACEIs、ARBs或含\naliskiren成分藥品來雙重阻斷RAAS，不良反應【例如:低血壓、高血鉀症及腎功能下降(包括\n急性腎衰竭)】之發生率較高。利尿劑：病人若以本品和利尿劑合併治療，在治療初期通常會造成極度低血壓，尤其是剛\n開始使用利尿劑的患者；服用本品的患者可停止利尿劑的使用或在以本品治療前增加鹽的\n攝取來降低血壓發生的機率。鉀離子補充品及留鉀利尿劑：benazepril 可減少 thiazide 利尿劑所造成的鉀離子流失；留\n鉀利尿劑（spironolactone、amiloride、triamterene 等）或鉀離子補充品會增加高血鉀症\n的危險性；若以此類藥品合併治療，應小心並隨時監測病人的血清鉀離子濃度。鋰製劑：於服用 ACEI 期間合併使用鋰製劑的病人，曾有報告指出會增加血中鋰的濃度及有\n鋰毒性的症狀出現；若需和鋰製劑合併治療時，應小心使用並建議隨時監測血中鋰的濃度。其他：當 benazepril 和口服抗凝血劑、β-腎上腺素阻斷劑、鈣離子阻斷劑、cimetidine、利\n尿劑、digoxin、hydralazine 和 naproxen 合併使用時，並沒有臨床上的證據顯示有重要的\n交互作用所引起的副作用發生。\n臨床試驗中，amlodipine 可和thiazide diuretics、β-阻斷劑、ACEI、long-acting nitrates、舌下\n三硝酸甘油脂、digoxin、warfarin、非類固醇抗消炎劑、抗生素和口服降血糖藥物安全使用。\n人類血漿的體外研究指出 amlodipine 對於測試的藥物（digoxin、phenytoin、warfarin 和\nindomethacin）並不會有蛋白質結合的效果，其他特殊的研究亦指出在健康自願者，\namlodipine 和 digoxin 合併使用不會改變血中 digoxin 的濃度或 digoxin 的腎臟清除率；和\ncimetidine 合併使用不會改變 amlodipine 的藥物動力學；和 warfarin 合併使用不會改變\nwarfarin 促進凝血的時間。致癌性、致突變性以及對生育力的損害\n給予大鼠及小鼠 benazepril 150 mg/kg/day 104 個星期，並沒有發現有致癌性的發生，以\n體重基礎計算，此劑量超過人體最大建議劑量的 100 倍；以身體表面積基礎計算，此劑量\n為人體最大建議劑量的 9 ~ 18 倍。以細菌的 Ames test、哺乳類動物細胞體外培養的突變性\n試驗或細胞核之不正常測試，均沒有致突變性的情形發生。在 50 ~ 500 mg/kg/day 劑量範\n圍內(以體重基礎計算為人體最大建議劑量的 38 ~ 375 倍，以身體表面積基礎計算為人類最\n大建議劑量的 6 ~ 61 倍)，benazepril 對於雄鼠和雌鼠的生育功能並不會造成不良的影響。\n以 0.5、1.25 和 2.5 mg/kg/day 劑量每天給予鼠類 amlodipine 持續 2 年，顯示沒有致癌的\n危險性，對於小鼠（但不適用於大鼠），最高劑量接近於最大可忍受劑量。以身體表面積\n基礎（mg/m2\n）計算，給予小鼠的劑量接近於臨床上最大建議劑量，給予大鼠的相同劑量相\n當於臨床上最大建議劑量的 2 倍。amlodipine 致突變性的研究顯示，不管在基因層次或染\n色體層次均沒有和藥物相關的作用出現。給予老鼠 amlodipine 劑量 10 mg/kg/day（以身體\n表面積基礎（mg/m2）計算，相當於 50 公斤人體最大建議劑量 10 mg 的 8 倍），並不會影\n響生育情形（雄鼠於交配 64 天前，雌鼠於交配 14 天前給藥）。\n以 benazepril：amlodipine 劑量 15：7.5 mg/kg/day 合併給藥，於雌鼠和雄鼠交配前和懷\n孕期間均沒有關於生育力的不良作用出現。懷孕\n懷孕分類 C\n（第一期）及 D\n（第二及三期）：請參閱〔警語〕之「胎兒∕新生兒發病率和死\n亡率」。\n授乳婦\n以 benazepril 治療之授乳婦，僅極少量的 benazepril 和 benazeprilat 會從乳汁中分泌，因\n此若新生兒僅食用母乳，只會接受到少於母親接受劑量的 0.1%。\n目前並不清楚是否 amlodipine 會從人體乳汁中分泌，因此建議當授乳婦需接受本品治療時\n，應停止哺乳。\n老人\n在美國所發表之臨床試驗中，19%為 65 歲以上的病人，2%為 75 歲以上的病人，並沒有發\n現在療效和安全性方面和年輕人有所不同。\n兒童\n用於兒童之安全性及有效性皆尚未確立。"
  },

   "text": "【不良反應】（參考文獻）\n國外臨床研究顯示，在超過 1,600 名的高血壓病人中，500 多名接受同成分複方藥物治療至\n少 6 個月，400 多名接受治療超過 1 年以上。所報告的副作用中，大部分均是輕微且暫時\n性的，而且這些副作用和年齡、性別、種族及治療時間沒有關係；約有 4%接受複方藥物及\n3%接受安慰劑的病人因副作用而停止治療；最常見的副作用為咳嗽和水腫*。以下是在美國\n以安慰劑控制的臨床試驗中，較常發生可能和此同成分複方藥物有關的副作用\n在美國以安慰劑控制的臨床試驗副作用發生率（%）\nBenazepril∕Amlodipine\nN=760\nBenazepril\nN=554\nAmlodipine\nN=475\nPlacebo\nN=408\n咳嗽 3.3 1.8 0.4 0.2\n頭痛 2.2 3.8 2.9 5.6\n頭昏 1.3 1.6 2.3 1.5\n水腫* 2.1 0.9 5.1 2.2\n*包括所有種類的水腫，例如：下垂部水腫、血管性水腫、臉部水腫。\n單以 amlodipine 治療的病人，水腫的發生率比合併治療的病人高，且達統計意義，水腫及\n其他副作用和 amlodipine 的劑量相關，且較易發生在女性身上。加入 benazepril 會使副作\n用發生率降低，且和種族及劑量無關（在試驗劑量範圍內）。\n以性別分層之副作用發生率（%）\nBenazepril∕\nAmlodipine Benazepril Amlodipine 安慰劑\n男性\nN=329\n女性\nN=431\n男性\nN=269\n女性\nN=285\n男性\nN=277\n女性\nN=198\n男性\nN=217\n女性\nN=191\n水腫 0.6 3.2 0.0 1.8 2.2 9.1 1.4 3.1\n潮紅 0.3 0.0 0.0 0.7 0.4 2.0 0.5 0.0\n心悸 0.3 0.5 0.4 1.4 0.4 2.0 0.5 0.5\n嗜睡 0.3 0.0 0.4 0.4 0.4 0.5 0.0 0.0\n以下是同成分複方藥物在美國所做以安慰劑對照的臨床試驗或上市後所發現其他可能和藥\n品有關的副作用：\n血管性水腫：包括嘴唇或臉部（請參閱〔警語〕之「血管性水腫」）。\n全身性：虛弱感、疲勞。\n神經系統：失眠、焦躁、焦慮、顫抖、性慾降低。\n皮膚系統：臉熱潮紅、紅疹、皮膚結節、皮膚炎。\n胃腸道系統：口乾、噁心、腹痛、便秘、腹瀉、消化不良、食道炎。\n代謝系統：低血鉀症。\n骨骼肌肉系統：背痛、骨骼肌肉痛、痙攣。\n呼吸系統：咽炎。\n泌尿生殖系統：陽萎、多尿症。\n其他不一定和藥品有關的罕見不良作用包括胸痛、心室性期外收縮、痛風、神經炎、耳鳴\n和脫髮。\n胎兒∕新生兒發病率和死亡率：請參閱〔警語〕之「胎兒∕新生兒發病率和死亡率」。\nBenazepril 和 amlodipine 單獨使用的安全性已分別在超過 6,000 名和 11,000 名病人參與的\n臨床試驗中評估，在這些試驗中，單獨使用的副作用和以合併複方治療的副作用相似。在\nbenazepril 上市後的資料中，有極少數的副作用報告為 Stevens-Johnson 症候群、胰臟炎\n疱、溶血性貧血、天 瘡和血小板減少症。曾有報告指出黃膽和嚴重肝臟酵素升高（常伴隨\n膽汁鬱滯）導致住院和 amlodipine 有關。其他和 ACEI 及鈣離子通道阻斷劑有關的重要副\n作用包括：嗜伊紅性肺炎（ACEI）和女樣男乳症。\n實驗室檢驗參數\n血清電解質：請參閱〔注意事項〕。\n肌胺酸酐：以此複方藥物治療的特發性高血壓病人，血清肌胺酸酐濃度會增高，但是輕微\n且可回復的，較常發生於腎功能不全或以利尿劑治療的病人及腎動脈狹窄且曾以其他 ACEI\n治療的病人（請參閱〔注意事項〕之「一般事項」）。\n其他（因果關係不明）：臨床上標準實驗室檢測的重要變化極少和同成分複方藥物的投與\n有關，曾有報告指出使用同成分複方藥物有血清膽紅素濃度和尿酸值升高的情形，另外有\n零星的個案發生肝臟酵素升高。\n【藥物過量】（參考文獻）\n只有極少數的服用 amlodipine 過量之個案報告，一病例在服用 250 mg 之後沒有任何症狀\n；另一病例服用 70 mg amlodipine 和大量的benzodiazepine，造成無法挽救的休克及死亡。\n以 amlodipine 和 benazepril 合併治療，至今仍無過量的報告；在以 benazepril 和其他 ACEI\n合併治療的零星過量個案中，並沒有導致死亡的報告。\n給予小鼠口服單一劑量之 benazepril∕amlodipine，劑量 50：25 mg/kg 時死亡率為 20%，劑\n量 100：50 mg/kg 時死亡率為 10%，劑量 500：250 mg/kg 時死亡率為 100%；對大鼠的\n研究，劑量500：250 mg/kg 時死亡率為 25%，劑量 900：450 mg/kg 時死亡率為 100%。\n處置：過量最常見的反應為血管擴張，連帶會發生低血壓和心搏過速，基本處置為增加體\n液以維持適當之血液量，另外可能需要 norepinephrine 或高劑量 dopamine 之增強心肌收\n縮力作用之藥物來刺激心肌。曾有報告指出其他 dihydropyridine 類鈣離子通道阻斷劑過量\n以氯化鈣和血糖激素加以處置，但並非標準處置；由於周邊血管張力突然回復，其他\ndihydropyridine 類鈣離子通道阻斷劑過量的處置有時會導致肺水腫，因此必須隨時監看病\n人以防此種情形出現。不曾有對於任何可加速 amlodipine、benazepril 或其代謝物操作（\n例如：改變尿液 pH 值）的經驗，benazepril 僅少量可被透析清除；不曾有報告指出利用血\n液透析或血液灌注清除 amlodipine，但因 amlodipine 的蛋白質結合率很高，因此用血液透\n析或血液灌注似乎不能發揮其效果。血管緊縮素II大概可當作 benazepril 的解毒劑，但是\n血管緊縮素II在一般的研究實驗室並不可得。\n【儲存】超過包裝上標示之保存期限後不應使用。\n請於 25°C室溫下保存。請置於兒童伸手不及處。\n【包裝】2 ~ 1000錠塑膠瓶裝、鋁箔盒裝。\n賦形劑：Mannitol, oral，Avicel 101，Primojel，Sicopharm yellow 10，PVP K30，Magnesium\nstearate， Crospovidone，Crospovidone XL，Pharmacoat 603(HPMC) ，Polyethylene glycol 6000，\nTitanium dioxide，Alcohol (95%) (莙覴膉蛍貟諸產跬)，Water purified(莙覴膉蛍貟諸產跬)\n總公司：台北市襄陽路 23 號 TEL：(02)23124200\n新豐工廠：新竹縣新豐鄉坑子口 182-1 號 ○A\nP2\nSize:210mm A 版 105.12.19"

   "text": "適應症：\n退燒、止痛 ( 緩解頭痛、牙痛、咽喉痛、關節痛、神經\n痛、肌肉酸痛、月經痛 )。"

  "68148": {
   "id": "68148",
   "licenseNo": "內衛藥製字第002676號",
   "sectionType": "dosage",
   "start": 1098,
   "text": "用法‧用量：\n醫師藥師藥劑生指示藥品。\n發燒或需要時服用，若症狀持續，則每 4~6 小時可重複\n服用，每 24 小時內不可超過 4 次。成人每次 1 錠， 12\n歲以上適用成人劑量；6 歲以上未滿 12 歲，適用成人劑\n量之 1/2 錠；3 歲以上未滿 6 歲，適用成人劑量之 1/4 錠；\n3 歲以下之嬰幼兒，請洽醫師診治，不宜自行使用。\n警語及注意事項：\n（一）肝毒性：\n1.使用acetaminophen (paracetamol)曾有發生急性肝衰竭\n的案例，並可能導致肝臟移植及死亡。大部份發生肝臟損\n害之病例係因使用超過每日4,000毫克的acetaminophen\n所致，且多涉及使用超過一種以上含acetaminophen成分\n之藥品。\n2.過量服用acetaminophen可能是因想要獲得更大的疼痛\n緩解效果，或是在不知道的情況下同時使用了其他同樣含\n有acetaminophen成分之藥品，因而造成用藥過量。\n3.有潛在肝臟疾病的病人，以及於使用acetaminophen期間\n喝酒者，有較高發生急性肝衰竭的風險。醫療人員應囑咐\n病 人 ， 病 人 亦 應 注 意 藥 品 的 標 示 中 是 否 含 有\nacetaminophen或paracetamol成分，不可同時使用超過\n一種以上含有acetaminophen成分之藥品。如果一天誤服\n超過4,000毫克的acetaminophen，即使並未感覺不適，也\n應立即就醫。\n（ 二 ） 與 酒 精 併 用 ： 不 得 併 服 含 酒 精 飲 料 ， 因 為\nacetaminophen可能造成肝損害。慢性重度酒精濫用者亦可\n能會因過度使用acetaminophen而增加肝毒性危險，本品不\n應與酒精併用。\n（三）過量：\n1.服用過量acetaminophen會在服藥24小時內看到初期症\n狀，可能包括：胃腸道不適、厭食、噁心、嘔吐、不適、\n蒼白及出汗。\n2.本品單次或多次過量使用有潛在的藥物成癮或濫用之可\n能，情況允許下，建議諮詢適當的專家。\n3.Acetaminophen過量最嚴重之不良反應為致命性之肝臟\n壞死。亦可能發生腎小管壞死，低血糖昏迷以及凝血異常\n之不良反應。用藥過量之肝毒性早期症狀可能包括：噁\n心，嘔吐，出汗和全身不適。肝毒性的臨床及實驗室證據\n可能要等到攝入後48~72小時才明顯可見。"
  },

  "80864": {
   "id": "80864",
   "licenseNo": "衛部藥製字第058071號",
   "sectionType": "contraindication",
   "start": 676,
   "text": "【禁忌】依文獻記載\n-胰島素依賴型的糖尿病病人(第一型）(例如，有酮血癥病史的糖尿病病人）、任何類型的急性代謝性酸中毒\n(如乳酸性酸中毒，糖尿病酮症酸中毒，糖尿病前期昏迷)。\n一已知對本藥物的主成分或任何賦形劑成分、sulfonylureas、sulfonamides或biguanide過敏者。\n一本藥尚無使用於嚴重肝功能不全或血液透析病人的經驗。有嚴重肝臟或腎臟功能疾病的病人，應使用胰島\n素·以使血糖獲得適當的控制。\n懷孕婦女、育齡期婦女、正在哺育母乳的母親。\n容易發生乳酸性酸中毒的病人、曾有乳酸性酸中毒之病史者、有腎臟疾病或嚴重腎衰竭（腎絲球體過濾率\n(GFR)小於30ml/min/1.73m2)，其原因可能來自於心血管虛脫(休克)、急性心肌梗塞及敗血癥。\n一若病人正接受碘化物顯影劑的靜脈注射·則應暫停本藥，因為這些物質可能會導致腎功能的急性變化。\n嚴重的感染、手術前後、嚴重外傷。\n一營養不良、饑餓、或衰弱的病人、或腦下腺或腎上腺功能不足者。\n一肝功能不全、嚴重的肺功能不全、及其他的情況如血氧過低、酒精攝取過量、脫水、包括腹瀉及嘔吐在內\n的腸胃道不適。\n一需藥物治療的鬱血性心臟衰竭。"
  },
  "80865": {
   "id": "80865",
   "licenseNo": "衛部藥製字第058071號",
   "sectionType": "precaution",
   "start": 1178,
   "text": "【警語】依文獻記載\n乳酸性酸中毒\n急性腎功能惡化時會造成metformin蓄積，且會增加乳酸性酸中毒的風險。一旦發生乳酸性酸中毒，它的致\n死率約可達50%。乳酸性酸中毒的發生可能也與某些病理生理狀況有關，包括糖尿病、明顯的組織灌流過低\n與血氧過低。\n乳酸性酸中毒的特徵為血中乳酸濃度升高(>5mmol/L)，血液pH值下降、陰離子間隙(aniongap)增加、電\n解質不平衡、乳酸與丙酮酸(lactate/pyruvate)的比值增加。若導致乳酸性酸中毒的原因為metformin，則\nmetformin的血漿濃度通常會高於5μg/mL。\n接受metforminHCl治療的病人發生乳酸性酸中毒的機率極低(發生率約為0.03案例/1000病人-年，致死率則\n約為0.015案例/1000病人-年)。被報告的案例主要為有明顯腎功能不全的糖尿病病人，這包括了腎臟內部的\n疾病與腎臟灌流不足，他們通常有多重醫療/外科方面的問題以及需要併服多種藥物。\n乳酸性酸中毒的危險會隨著腎功能不全的程度與病人年齡的增加而增加。然而，若以metformin最低有效劑\n量治療病人並且定期監測其腎功能，則乳酸性酸中毒的危險可能得以顯著地降低。\n在脫水（嚴重腹瀉或嘔吐，發燒或液體攝入減少）的情況下，應暫停metformin並建議與專業醫療人員聯\n繫。\n以metformin治療的病人，對於會急性造成腎功能損害的藥物（例如抗高血壓藥，利尿劑和NSAIDs）應謹慎\n使用。\n與乳酸性酸中毒有關的其它風險因素有：過度的酒精攝入，肝功能不全，未適當控制的糖尿病，長時間空\n腹，與缺氧相關的任何狀態，以及同時使用可能引起乳酸性酸中毒的藥物。\n肝功能不全可能會顯著限制其清除乳酸的能力，因此病人如果在臨牀或實驗診斷上確定患有肝臟疾病，則\nmetforminHCI對乳酸代謝的影響。此外，病人接受任何血管內顯影劑檢查及任何外科手術之前，應先暫時\n停用本藥。\n乳酸性酸中毒在剛開始時通常很難捉摸，因為它只出現非特定性的症狀，例如：不舒服、肌痛、呼吸困難、\n嗜睡感增加、以及非特定性的腹部不適。較明顯的酸中毒則可能會出現體溫過低、低血壓以及心跳節律過慢\n等症狀。應告知病人及/或護理者乳酸性酸中毒的風險。如有疑似症狀，病人應停止服用metformin並立即就\n醫。\n測量血清的電解質、酮(ketones)、血糖、血液pH值、乳酸的濃度及血中metformin之濃度可能也有所幫助。\n一旦病人服用任何劑量的本藥物達到穩定狀態後，若有腸胃道症狀出現，則可能與藥物無關。該腸胃道症\n狀在metformin治療初期相當常見，但若在服藥穩定後纔出現，則可能與乳酸性酸中毒或其它嚴重的疾病有\n關。\n服用本藥物的病人，若其空腹的靜脈血漿乳酸濃度超過正常值的上限，但低於5mmolVL，則不代表一定會出\n現乳酸性酸中毒·它可能有其他原因·例如：糖尿病控制不佳或肥胖、劇烈的運動、或檢體處理上的技術性\n問題。\n代謝性酸中毒的糖尿病病人若無酮酸中毒的現象(酮尿及酮血癥)，則應懷疑乳酸性酸中毒的可能性。\n乳酸性酸中毒是一種必須接受住院緊急治療的急症。服用本藥的病人若出現乳酸性酸中毒，應立刻停藥，並\n且馬上給與一般性的支持性療法。因為metforminHCI可以被透析(在良好的血液動力學狀態下，其廓清率可\n達170ml/min)，所以建議以立即性的血液透析方式來治療酸中毒並清除累積的metformin。這種處理方式通\n常可以迅速逆轉酸中毒的症狀並使之康復。\n增加心血管疾病死亡率的危險性\n有報告指出，相較於單獨的食物療法或食物併用胰島素治療，服用口服降血糖藥物的病人有較高的心血管疾\n病死亡率。這項警訊是根據多所大學所共同執行的糖尿病研究計畫(UGDP)結果所提出，該計畫的目的在評\n估非胰島素依賴型的糖尿病病人服用降血糖藥物後，其預防或延緩血管性併發症的效果。\nUGDP的報告指出，病人以飲食加上固定劑量的tolbutamide(每日1.5公克)或phenformin(100毫克/日)治\n療5~8年後，其心血管疾病的死亡率為單獨以飲食控制之病人的2.5倍，究具原因主要為tolbutamide或\nphenformin停藥所致。雖然這些結果的解釋仍有所爭議，但是UGDP的研究發現卻也為此警訊提供了一個適\n當的基礎。病人應被告知glimepiride可能存在的潛在危險與利益，以及替代治療。\n雖然sulfonylurea類(tolbutamide)及biguanide類(phenformin)藥物都只選取一種作為研究藥物，但是我們應從\n審慎的安全性觀點來加以考量，因為這項警訊有可能發生在其他同類的降血糖藥物上，因其作用方式與化學\n結構相似。\n【使用時的注意事項】依文獻記載\n應該警告病人使用本藥時，在開車與操作機械時應小心。\n【一般的注意事項】依文獻記載\n平時控制血糖應以飲食與運動的方式雙管其下，必要時，可配合減重與定時服用本藥物來控制。臨牀上若\n出現以下的徵兆，則表示血糖未獲得適當的控制，包括尿量減少、口渴、易渴(dipsia)及皮膚乾燥等。\n應告知病人本藥物的潛在危險與利益。同時也應告知病人遵照飲食建議與規律性運動的重要性。應向病人\n強調正面合作的重要性。\n的果汁、含糖的茶等)。病人應該隨身攜帶大約20公克糖。血糖過低時，可能還需要其他人的幫助以避\n免併發症的產生。人工代糖則無升高血糖的效果。\n病人應接受嚴密的觀察。若為嚴重的低血糖，則需立刻接受醫師的進一步治療與追蹤，在某些情況下，甚\n至需要住院治療。\n一若病人需要接受其他醫師或藥師的治療(例如：住院、意外、須請假一天去看病等)，則病人應主動告知醫\n療人員其目前的糖尿病狀況及之前接受的治療。\n在特別的壓力情況下(例如：外傷、手術、發燒性的感染)，會使血糖的調節機制惡化，這時可能需要暫時\n改用胰島素，以維持良好的代謝控制。\n一本藥物應以最低的有效劑量給與。治療期間應定期監測血液及尿液中的血糖濃度(此外，也建議測量糖化血\n色素所佔的比例)。同時應評估該治療的效果，若效果不彰，則應該立刻改用其他的療法。\n血糖過低或過高都有可能使病人警覺性及反應變差，該狀況特別容易發生在治療改變的前後或沒有定時服\n藥時。這可能會使病人開車與機械操作的能力受到影響。\n監測腎功能：已知本藥物主要由腎臟排除。因此，metformin的累積與乳酸性酸中毒的危險性會隨著腎功\n能受損程度的增加而增加。所以，若病人的血清肌氨酸酐濃度高於其年齡標準值的上限，則不應服用本\n藥。\n於治療開始前及治療期間應定期評估腎絲球體過濾率(GFR)。Metformin禁用於腎絲球體過濾率(GFR)\n<30ml/min/1.73m2的病人，且當腎功能改變時，病人須暫時停止治療。對於高齡病人，本藥的劑量應慢\n慢增加，以調整到可適當控制血糖的最低有效劑量，因為腎功能通常會隨著年齡的增加而降低。老年病人\n小心。\n併用其他的藥物可能會對腎功能或metformin的分佈造成影響：併服的藥物可能會影響腎功能，或導致血\n流動力學的顯著變化，或幹擾本藥物的分佈，例如：主要是由腎小管分泌排除的陽離子藥物，使用上應小\n心。\n一放射性研究中所使用於血管內的碘化物顯影劑（例如：利用題影劑所進行的靜脈尿路X光攝影·靜脈瞻囊及\n膽管X光攝影·血管攝影，以及電腦斷層掃描（CTU：血管內放射性研究的碘化物會導致腎功能的急劇變\n化，因此可能與服用本藥物的病人出現乳酸性酸中毒有關(參閱【禁忌】）。所以，病人如欲參與該類檢\n查，則應在檢查流程開始時或之前先停用本藥，檢查流程結束後必須至少間隔48小時，並且重新評估腎功\n能，只有在腎功能正常的情況下才能再次服用本藥。\n氧氣不足的狀態：包括任何原因所造成的心血管虛脫（休克）、急性鬱血性心臟衰竭、急性心肌梗塞、其他\n與乳酸性酸中毒相關的血氧過低，及腎前氮血症。\n在本藥治療期間若有上述情況發生，則應立刻停藥。\n手爾過程：如欲進行一般，脊髓或硬脊膜外麻醉手術，則應暫停本藥（不影響食物與流質攝取的小手術除\n外），除非病人已經可以開始口服進食，且其腎功能評估為正常，否則不應於術後48小時內恢復本藥的使\n用。\n-喝酒：已知酒精會加強metformin對乳酸代謝的影響。因此，在本藥治療期間，都應警告病人不要過度飲\n酒，不論是短期或長期。\n-肝功能不至：某些乳酸性酸中毒的報告與肝功能不全有關，若病人有明顯的臨牀上或實驗診斷上的肝臟疾\n病，則一般應避免使用本藥。\n-維他命B的濃度：在為期29週、有對照組的臨牀試驗中，約有7%原本維他命B2濃度正常的病人，在接受\n本藥治療後，出現沒有臨牀徵兆但維他命B，2濃度低於正常值的情況。維他命B2的濃度之所以降低，可能\n是因為自維他命B2-內在因子複合物的吸收受到幹擾所致。然而，因此而導致貧血的報告極為罕見，在停\n用本藥或給與維他命B，2補充劑後通常都能很快恢復正常。接受本藥治療的病人，建議其每年測量一次血\n液學參數，若發現有任何明顯的異常，則應做適當的檢查與處理。某些病人（維他命B或鈣質的攝取與吸\n收不足)屬於較可能出現維他命B2濃度低下的族羣。這類病人則最好每隔2~3年定期測量血清中維他命B2\n的濃度。\n一之前已獲得控制的糖尿病狀出現了臨牀上的變化：之前服用metforminHCI錠劑已獲得良好控制的糖尿病\n病人，若出現實驗檢驗值的異常或臨牀上的疾病(特別是不明確及不明原因的病症)·則應立即評估是否為\n酮酸中毒或乳酸性酸中毒。評估的項目應包括血清電解質、酮、血糖，如有必要，可納入血液pH值、乳\n酸、焦葡萄酸鹽及metformin濃度的測量。不論發生那一型的酸中毒，此時都應立刻停用本藥，並採取其\n他適當的方法治療之。\n病人的資訊：應告知病人本藥可能存在的潛在危險與利益，及其替代性的療法。同時，亦應告知病人遵照\n飲食建議、規律運動、定期測量血糖、糖化血色素、腎功能以及血液學參數的重要性。\n關於乳酸性酸中毒的危險、症狀及容易出現的狀況，已記載於警語及一般注意事項中，應向病人說明之。若\n有未預期性的換氣過度、肌痛、身體不適、不正常的嗜睡或其他的非特定性症狀出現，病人應立刻停藥並通\n知其醫護人員。病人服用任何劑量的本藥物一旦達到穩定狀態後，若出現腸胃道症狀，則不太可能與本藥有\n關。因為與藥物相關的腸胃道症狀通常出現在治療的初期。治療穩定後所出現的腸胃道症狀可能與乳酸性酸\n中毒或其他嚴重的疾病有關。\n服用本藥治療期間應建議病人避免短期或長期飲酒過量。\nMetformin單方治療通常不太會造成血糖過低的情況，但若metformin與其他口服sulfonylurea併服則有可能發\n生。病人若要接受藥物併用治療，則應向其說明低血糖的危險、其症狀與治療方式，及容易出現的狀況。\n【特殊的注意事項】依文獻記載\n低血糖：因為本藥有降血糖的效果，所以可能會出現血糖過低的情況，且其作用也可能延長。血糖過低可能\n出現的症狀包括，頭痛、極度饑餓、噁心、嘔吐、倦怠、想睡、睡眠失調、不安、有攻擊性、注意力無法集\n中、警覺性與反應變差、憂鬱、精神混亂、說話無條理、無法言語、視覺障礙、震顫、局部麻痺、感覺失\n調、暈眩、無助感、失去自我控制能力、證妄、大腦痙攣、嗜睡、及失去意識，包括昏迷、呼吸深度變淺與\n心跳變慢。\n此外，可能會出現腎上腺反向調節的症狀如流汗、皮膚濕黏、焦慮、心跳加速、高血壓、心悸、心絞痛及心\n律不整。\n嚴重低血糖發作的臨牀表徵可能與中風類似。當血糖過低的情況改善後，其症狀通常能獲得緩解。\n因為低血糖的危險性增加，所以在剛開始治療的第一週必須小心監測。有低血糖危險的病人及情況如下：\n一不願意或無能力配合的病人(較常見於年長的病人)。\n營養不良、用餐不定時、未進食。\n運動量與醣類攝取量之間不平衡。\n飲食改變。\n一喝酒，特別是在未進食時飲用。\n腎功能受損。\n一肝功能嚴重受損。\n一本藥服用過量。\n內分泌系統的某些非代償性疾病(例如：甲狀腺功能的疾病及腦下垂體前葉或腎上腺皮質功能不足)：會影\n響醣類的代謝或低血糖的反向調節能力。\n目前併服的其它藥物（參閱【交互作用】）。\n這些病人應該嚴密監測其血糖，同時病人如有上述的因子存在或有低血糖的症狀出現，則應主動告知其醫師\n或藥師。若有低血糖的危險因子存在，則可能需要調整本藥的劑量或整個治療方式。在治療時發生疾病或病\n人的生活形態改變，也需要作劑量或治療方式的調整。但是當低血糖為漸近形成時，老年人、以及有自主神\n經病變或同時併服β-阻斷劑、clonidine、reserpine、guanethidine或其他抗交感神經藥物者，則反應身體腎\n上腺反向調節機制（參閱【不良反應】）的低血糖症狀有可能相當輕微或甚至沒有症狀。\nGlimepiride\n葡萄糖-6-磷酸脫氫酶（G6PD）缺乏的病人使用sulfonylureas藥物治療可能會導致溶血性貧血。因為\nglimepiride屬於sulfonylureas藥物，因此葡萄糖-6-磷酸脫氫酶缺乏的病人使用時應小心並應考慮以非\nsulfonylureas藥物替代。\nMetformin\nMetformin hydrochloride應在選擇性全身麻醉前48小時停藥且不得於之後的48小時內重新給藥。\n甲狀腺功能低下的病人建議定期監測甲狀腺刺激素（TSH）的濃度。\n長期使用metformin治療，會伴隨血清中維他命B2的濃度降低，可能導致周邊神經病變，建議監測維他命B2\n的濃度(參閱【不良反應】)。"
  },

   "text": "【交互作用】依文獻記載\n接受本藥治療的病人若併服或停用其他藥物，會使glimepiride的降血糖作用不正常的增加或降低。根據使用\n1.本藥是由細胞色素P4502C9(CYP2C9)所代謝。因此，併服的藥物若為CYP2C9誘導劑(例如：rifampicin)\n或抑制劑(例如：fluconazole)，則會影響本藥的代謝。\n2.會加強降血糖效果的藥物：\n胰島素及□服降血糖藥物、ACE抑制劑、allopurinol、合成代謝性類固醇、男性荷爾蒙、\nchloramphenicol、coumarin類的抗凝血藥物、cyclophosphamide、disopyramide、fenfluraminde\n素、水楊酸鹽、sulfinpyrazonesulfonamide、tetracyclines、tritoqualine、trofosfamide。\n3.會減弱降血糖效果的藥物：\nAcetazolamide、barbiturates、皮質類固醇、diazoxide、利尿劑、腎上腺或交感神經刺激劑、升糖激素、\n緩瀉劑(長期使用)、菸草酸(高劑量)、動情激素、黃體素、phenothizines、phenytoin、rifampicin及甲狀腺\n荷爾蒙。\n4.會加強或減弱降血糖效果的藥物：\nH2拮抗劑、clonidine、reserpine。\n5.β-阻斷劑會降低葡萄糖的耐受性。葡萄糖的耐受性降低可能會影響其代謝性的控制。β-阻斷劑可能會增\n加(肇因於反向調節失效)。\n6.降低或阻斷腎上腺素反向調節血糖過低之訊號的藥物：\n7.短期或長期性的飲酒，都可能會在未預期的情況下，加強或減弱本藥降血糖作用。\n8.本藥有可能加強或減弱coumarin類藥物的效果。\n9.膽汁酸螯合劑：colesevelam會與glimepiride結合並降低glimepiride在腸胃道的吸收。當glimepiride\n比colesevelam早於至少4小時服用時並未觀察到此交互作用。因此，服用glimepiride應該至少早於\ncolesevelam 4小時。\n1.與下列的藥物併用有可能會導致乳酸性酸中毒。當併用碘化物顯影劑、具有高腎毒性的抗生素(gentamicin\n等)時，應嚴密監測病人的狀況。\n有些藥物對於腎功能會產生不利影響，這可能增加乳酸性酸中毒的風險，例如：NSAIDs·包括選擇性環\n加氧酶(COX)I抑制劑，ACE抑製劑，血管收縮素II受體拮抗劑和利尿劑，尤其是環利尿劑。當metformin\n與這些藥物開始併用時，需密切監測腎功能。\n2.與下列的藥物併用時，可能會加強或減弱降血糖的效果。當與這些藥物併服時，應嚴密監測血糖與病人的\n狀況。\n一會加強降血糖效果的藥物：\n胰島素、sulfonamides及sulfonylureas類的藥物.合成代謝性類固醇、guanethidine、水楊酸鹽(aspirin\n等）、β-阻斷劑、MAO抑制劑。\n一會減弱降血糖效果的藥物：\n腎上腺素、皮質類固醇、甲狀腺荷爾蒙、黃體素、利尿劑、pyrazinamide、isoniazid、菸草酸、\nphenothizines。\n3.Glyburide：在一項針對第二型糖尿病病人所做的單一劑量交互作用研究顯示，metformin與glyburide併用\n並不會對metformin的藥動學或藥效學造成影響。Glyburide的曲線下面積(AUC)及最高血中濃度(Cma)則會\n降低，但其變化差異性極大。由於本試驗的設計為單一劑量給藥，再加上glyburide的血中濃度與其藥效學\n之間缺乏關連性，因此此項交互作用的臨牀意義無法確定。\n4.Furosem/de：根據一項針對健康受試者所作的單一劑量metformin-furosemide交互作用研究顯示，這兩種\n藥物併用會對兩者的藥動學參數產生影響。\nFurosemide會使metformin的血漿及血液中最高濃度(Cmax)增加22%，血液中藥物濃度曲線下面積(AUC)增\n加15%，至於metformin的腎臟廓清率則無任何顯著的改變。當與metformin併服時，furosemide的最高血\n中濃度與藥物濃度曲線下面積會比單獨用藥時分別減少了31%及12%，其最終半衰期則減少了32%·但是\nfurosemide的腎臟廓清率則無任何顯著的改變。Metformin與furosemide長期併用的交互作用則無資料可供\n參考。\n5.Nifedipine：根據一項針對健康志願受試者所作的單一劑量metformin-nifedipine交互作用研究顯示，與\nnifedipine併服會使metformin的最高血漿濃度(Cmax)與藥物濃度曲線下面積(AUC)分別增加20%及9%，並\n提高在尿液中的排除量。Metformin對nifidepine的影響則相當有限。\n6.陽離子藥物：陽離子藥物(例如：amiloride、digoxin、morphine、procainamide、quinidine、quinine、\nranitidine、triamterene、trimethoprim及vancomycin)是經由腎小管分泌排除，所以理論上它們會因為\n與metformin競爭腎小管的運輸系統而相互幹擾。針對正常的健康志願受試者所做的metformin與口服\ncimetidine併用之單一劑量與多劑量交互作用研究顯示，metformin在血漿與全血中的最高濃度增加了\n60%.藥物濃度曲線下面積則增加了40%。從單一劑量研究的結果看來，metformin的排除半衰期並無改\n變。Metformin對cimetidine的藥動學則無影響。雖然上述的交互作用有其合理性(cimetidine除外)，但是病\n人若有服用經由近端腎小管分泌系統排除的陽離子藥物，則建議應小v心監測其狀況並調整metformin與/或\n相互幹擾之藥物的劑量。\n7.其他：有些藥物會引起血糖升高，因此可能會導致血糖控制失敗。這些藥物包括thiazide及其他利尿劑、皮\n質類固醇、phenothiazines、甲狀腺藥物、黃體素、口服避孕藥、phenytoin、菸草酸、交感神經刺激劑、\n鈣離子阻斷劑以及isoniazid。當這些藥物與metformin併用時，應小v心監測病人的情況，以使血糖獲得適當\n的控制。\n針對健康志願受試者所做的單一劑量交互作用研究顯示，metformin與propranolol併用以及metformin與\nibuprofen併用，彼此的藥動學都不受影響。\nMetformin幾乎不與血漿蛋白結合，因此相對於sulfonylureas(高蛋白結合藥物)，metformin與高蛋白結合藥\n物(例如：水楊酸鹽、sulfonamideschloramphenicol及probenecid)之間應該較無交互作用。\nMetformin可能降低phenprocoumon的抗凝血作用，建議嚴密的監測INR。\nLevothyroxine會降低metformin降血糖的效果.建議監測血糖，尤其在開始或停止甲狀腺賀爾蒙治療時，必\n要時須調整metformin的劑量。\n有機陽離子轉運蛋白(Organic cation transporters，OcT）：\nMetformin是兩種轉運蛋白OCT1和OCT2的反應物。\nMetformin與下列藥物併用：\n-OCT1抑製劑可能會降低metformin的療效。\n-OCT1誘導劑可能會增加metformin的胃腸吸收和功效。\n-OCT2抑製劑可能會減少腎臟排除metformin，從而導致metformin血漿濃度升高。\n一OCT1和OCT2的抑製劑可能改變metformin的功效及腎臟排除。\n因此建議特別是腎功能不全病人，當併用這些有機陽離子轉運蛋白藥物與metformin時，metformin血漿濃度\n可能會增加。因OCT抑製劑/誘導劑可能會改變metformin的功效，如果需要可以調整metformin的劑量。\n不建議同時併用於：\n一酒精：\n酒精中毒與乳酸性酸中毒的風險增加有關，特別是在空腹，營養不良或肝功能不全的情況下。\n碘化物顯影劑：\nmetformin必須在成像過程前或期間停止，並且於至少48小時後且腎功能重新評估穩定後，才得重新開始\n治療。\n【懷孕與授乳】依文獻記載\n請勿在懷孕期間服用本藥，否則可能會對胎兒造成傷害。病人若已懷孕或計畫懷孕，應事先告知其醫師。這\n類病人建議應改用胰島素治療。\n為了避免嬰兒吸允到含有藥物的母乳而受到可能的傷害，如有必要，病人應改用胰島素治療或停止哺育母\n乳。\n【兒童的使用】依文獻記載\n本藥用於兒童的安全性與有效性尚未建立。尚未有針對年輕族羣的糖尿病病人(maturity-onset diabetes of\nthe young (MODY))所作的研究。\n【老年人的使用】依文獻記載\nMetformin主要由腎臟排除，若病人的腎功能受損，則發生嚴重不良反應的危險性會提高。所以metformin\n只建議使用於腎功能正常的病人。腎功能會隨著年齡的增加而降低，因此年齡漸長後應小心metformin的使\n用。劑量的選擇必須加以注意，並且小v心且定期地監測腎功能。一般說來，不應將老年病人的metformin劑\n量調整至最大劑量。\n在開始使用含有metformin藥品治療前應評估病人之腎功能（GFR），並且至少每年一次。對於腎功能惡化\n風險增加的病人及老年病人，應更頻繁地評估其腎功能，例如，每3-6個月。\n對於GFR<60mL/min/1.73m2之病人於考慮開始服用metformin之前·應評估其可能增加乳酸性酸中毒（參\n閱【警語】）的風險因素。\n若複方藥物治療劑量不足，應改用各別單方藥物治療取代。\nGFR ml/min/1.73m2\n每日最高劑量3000mg。\n60-89\nGlimepiride每日最高建議劑量為8mg。\n劑量減少調整應考慮與腎功能衰退相關。\n在嚴重性腎臟或肝臟功能異常發生的病\n<30\n禁用Metformin。\n患，必需換成胰島素治療。\n一味覺障礙(頻率未知)。\n一皮膚及皮下粗織症狀：脫髮（頻率未知)。\n一般症狀：可能發生過敏性或類過敏反應，如：搔癢、出疹及蕁麻疹。輕度過敏反應可能會演變成嚴重的\n呼吸困難、血壓下降，有時甚至會休克。如出現蕁麻疹應立即通報醫師。\n與sulphonylurea類、sulphonamides類或相關藥物間可能產生交叉過敏反應。\n在個別情況下，可能發生血漿鈉離子濃度降低及過敏性血管炎或皮膚對光過敏。\n一其它症狀：如同所有sulfonylureas藥物，Glimepiride可能會導致體重增加（頻率未知）。\n一乳酸性酸中毒：（參閱【警語】及【過量】）。\n一血糖過低。\n-腸胃道：腸胃道之症狀(腹瀉、噁心、嘔吐、腹部腫脹、脹氣及厭食)為本藥最常見的反應，其單藥治療發\n生腸胃不適的比例大約比安慰劑治療高出30%，特別是在木藥治療的初期。這些症狀通常為暫時性的，在\n持續治療後通常會自動消失。偶爾將劑量暫時降低可能有助於症狀的緩解。臨牀試驗中，因腸胃道不適而\n停藥的病人約佔4%。\n治療初期的腸胃道不適通常與劑量多寡有關，藉由劑量逐漸增加的方式以及藥物與食物併服，將有助於使\n這些症狀滅輕。\n因為嚴重的腹瀉與/或嘔吐可能會導致脫水及腎前氮血症，在這種情況下應該暫停本藥。\n若病人已經穩定的使用本藥，除非已排除其他的併發症或乳酸性酸中毒的可能，否則非特定性的腸胃道症\n狀應該與治療無關。\n一特殊的感覺：本藥物治療初期約有3%的病人可能會出現令人不悅或金屬味道的味覺，但這種症狀通常會\n自動消失。\n一皮膚的反應：有可能出現紅疹等。在這種情況下，應暫停本藥。\n一血液方面：較為罕見，有可能出現貧血、白血球減少症或血小板減少症。\n約有9%以本藥單方治療的病人及6%以本藥/sulfonylurea單方治療的病人會出現無症狀的血清維他命B，濃\n度偏低的情形。病人維他命B2缺乏有周邊神經病變的案例曾在上市後的經驗被報導(發生頻率未知)(參閱\n【特殊的注意事項】）；血清的葉酸濃度則無顯著的減少。服用本藥物只有巨母紅血球貧血曾被報告過，但\n神經性病變的發生率則未見增加。因此，血清的維他命B2濃度應該予以適當的監測或考慮定期注射維他命\nB12補充劑。\n肝膩方面：偶爾會有肝功能受損發生。\n-溶血性貧血(頻率未知)\n甲狀腺功能低下病人的甲狀腺刺激素濃度會下降（參閱【特殊的注意事項】）。\n腹瀉導致的低血鎂(頻率未知D)\n-腦病變(頻率未知)\n一光過敏(頻率未知)\n若有上述提及的不良反應、其他的不良反應、或未預期的變化出現，病人應立刻通知其醫療照護人員。有些\n不良反應在某些情況下可能會危及生命，包括嚴重的血糖過低、特殊的血液學變化、嚴重的過敏或偽過敏反\n應，以及肝功能不全。若出現這些反應，病人應該立刻通報醫師，並在醫師給與進一步指示前先停藥。\n在地區性的第一期(phase I)與開放性的第三期(phase ll臨牀試驗中，除了glimepiride及metformin已知的不\n良反應外，並未觀察到本藥物出現其他未預期的不良反應。\n【過量】依文獻記載\n一徵兆及症狀\n急性過量及長期接受glimepiride過高劑量之治療有可能導致嚴重危及生命的血糖過低。\n一處理\n一旦發現glimepiride過量，應立刻通知醫師。病人應立刻攝取糖分，且盡可能為葡萄糖形式，但若為醫師已\n開始治療過量的情況則除外。\n小心監測是必要的，應監測至醫師確定病人脫離危險為止。切記，低血糖在初次康復後有可能復發。\n有時候住院是必要的，即使只是預防措施。特別是當明顯過量及有嚴重反應的徵兆時，例如失去意識或其他\n嚴重神經障礙之具有醫療緊急性且需要立即治療及住院者。\n若診斷確定或懷疑為低血糖昏迷，則應立刻給與病人靜脈注射高濃度(50%)的葡萄糖溶液。繼之則持續靜脈\n輸注較稀濃度(10%)的葡萄糖溶液，以維持血糖濃度高於100mg/dL。血糖過低的臨牀狀況在康複後有可能復\n發，因此應嚴密監測至少24-48小時。\n嬰兒及幼童因意外攝取glimepiride而需要治療低血糖的情況較為特別，葡萄糖的劑量必須非常小v心地調整，\n否則有可能造成危險的高血糖，故應嚴密監測以控制血糖。\n若病人的glimepiride攝取量足以危害生命，則應予以解毒(例如，洗胃及投以醫療用活性碳)。\n以急性葡萄糖替代治療完成後，通常必須靜脈輸注較低濃度的葡萄糖溶液以確保低血糖不會復發。病人的血\n糖濃度應嚴密監測至少24小時。嚴重個案的時程可能會拉長，低血糖，或再次陷入低血糖的危險，可能會持\n續數天之久。\nMetformin的劑量高達85公克時，未見有低血糖的情況發生，雖然在此情況下有可能發生乳酸性酸中毒。高\n度過量或伴隨metformin的風險有可能導致乳酸性酸中毒。乳酸性酸中毒具有醫療緊急性且必須住院治療。\n清除乳酸及metformin最有效的方法為血液透析。\nMetformin過量有可能導致胰臟炎。\n【實驗檢測】依文獻記載\n所有接受治療的糖尿病病人都必須定期測量其空腹血糖及糖化血色素的濃度，其目的在使這些濃度降至正常\n範圍。在剛開始做劑量的調整時，空腹的血糖濃度值可作為對治療反應的參考。因此，血糖與糖化血色素的\n濃度都必須加以監測。測量糖化血色素的濃度對評估糖尿病的長期控制可能有相當的助益。\n應至少每年一次定期監測血液學參數(例如：血紅素/血容比及紅血球數值)以及腎功能(血清肌酸酐)。以\nmetformin治療時，極少出現巨母紅血球資血，若有懷疑時，應先排除維他命B12缺乏的可能性。\n【致癌性、突變性、生育能力受損】依文獻記載\n分別給與大白鼠(給藥期間為104週）與小白鼠（給藥期間為91週）900毫克/公斤/日及1500毫克/公斤/日的劑量以\n作長期的致癌性研究。根據體表面積來計算，上述兩個劑量大約為人類所服用的每日最大建議劑量的3倍。\nMetformin在雄性與雌性的小白鼠身上皆未證實有致癌性。相同地，metformin在雄性大白鼠身上也未見有致\n癌的可能性。然而，以900毫克/公斤/日的劑量治療雌性大白鼠，則發現其良性子宮基質息肉的發生率有增加\n的趨勢。\n在Ames測試(S.typhimurium)、基因突變測試(老鼠淋巴瘤細胞)、染色體變異測試(人類淋巴細胞)、或活體內\n微核形成試驗(小白鼠骨髓)中，皆未能證實metformin具有突變性。\n給與雄性或雌性大白鼠高達600毫克/公斤/日的metformin劑量，或以體表面積計算，約為人類每日最高建議\n劑量的2倍，並未見大白鼠的生育能力受到影響。\n【藥物的濫用與依賴】依文獻記載\n從metformin HCI的藥效學特性看來，不論是主要或次要的特性，皆未見其有使藥物成為娛樂上濫用或成癮\n的可能。\n【保存條件】\n請儲存於25°C以下、乾燥處貯存。\n須置於小孩接觸不到之處。\n【包裝】\n2~1,000錠塑膠瓶裝、鋁箔盒裝。\n衛部藥製字第058071號"

        ],
      },
    },
    [LIC.tinten]: {
      plainWhatIsIt: '這是**退燒、止痛**的藥，成分叫**乙醯胺酚**（英文 acetaminophen 或 paracetamol），一錠 250 毫克。藥局就買得到，是**指示藥**，藥師會告訴你怎麼吃。',
      plainPurpose: '**發燒**的時候退燒，**痛**的時候止痛：頭痛、牙痛、喉嚨痛、關節痛、神經痛、肌肉痠痛、月經痛都可以。',
      plainHowToTake: '**痛或發燒的時候才吃**，大人**一次 1 錠**。還是痛可以**隔 4 到 6 小時再吃一次**，但**一天最多 4 次**。**連續吃 3 天還沒好就要去看醫師**；大人**最多連續吃 7 天**。\n**最重要的一件事**：很多感冒藥、止痛藥裡面**也有乙醯胺酚**，**不要同時吃兩種**，吃太多會**傷肝**。\n小孩要減量：6 到 12 歲吃半錠，3 到 6 歲吃四分之一錠，**未滿 3 歲不要自己給**。放在小孩拿不到、陰涼的地方。',
      plainSideEffects: '可能會**起疹子、皮膚紅紅的、想吐、吃不下、頭暈、耳朵嗡嗡叫**。有這些就先停藥，去問藥師或醫師。',
      plainWhenToSeekCare: '**吃太多最危險**：一天超過 **4,000 毫克**（這顆藥就是 **16 錠**），**就算沒感覺也要立刻去醫院**，因為肝可能會壞掉，而且**要過一兩天才看得出來**。\n吃了之後**起疹子、皮膚紅、一直吐、很不舒服、臉色蒼白、冒冷汗**，也要停藥就醫。',
      items: {
        contraindications: [
          '**以前吃藥過敏過**的人不能吃。',
          '**未滿 3 歲**的小孩，沒有醫師藥師說可以，就不要吃。',
        ],
        dietConflicts: [
          '**不能配酒喝**，會傷肝。',
          '**每天喝 3 杯以上酒**的人，吃之前要先問醫師。',
          '**長期喝很多酒**的人，這顆藥更容易傷肝。',
        ],
        populationWarnings: [
          '**懷孕、餵母奶**的人，沒有醫師藥師說可以，就不要自己吃。',
          '**未滿 3 歲**的小孩不要自己給，去看醫師。',
          '**本來肝就不好**、或吃藥期間**喝酒**的人，**急性肝衰竭**的風險比較高。',
        ],
      },
    },
  };

  window.DEMO = {
    LIC, profile, chronicOptions, chronicLabel, recognition, tags, deriveProfileTags, skipReason,
    followups, interactions, crossNotes, quiz, schedule, weekLogs, cabinet, care, qaRules, qaFallback, quickQuestions, qaHistory, plainKid,
  };
})();

</script>
  <script>
// 藥智通 網頁示範版 — 流程邏輯
// 導覽跟 App 一樣：調查表→辨識→確認→首頁；首頁點藥品進說明、點卡片進交互作用與測驗，
// 其餘功能在右上角「更多功能」。每一頁有自己的 render、bind、gate；底部動作列的按鈕由 ACTIONS 決定。
//
// 資料分兩層：預載的三款藥（drug-data.js + demo-data.js）與使用者之後新增的藥（走 /api，真實仿單 + AI 生成）。
// 兩者進到 state.drugs 之後長得一樣，頁面不分辨來源。所有狀態存在 localStorage，重新整理不會消失。
(function () {
  const D = window.DEMO;
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const hl = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<mark>$1</mark>').replace(/\*\*/g, ''); // **重點** → 螢光標記
  const SECTION_LABEL = { indication: '適應症', dosage: '用法用量', contraindication: '禁忌', precaution: '注意事項', interactions: '交互作用', side_effects: '不良反應', special_population: '特殊族群' };
  const CAT_TAG = (cat) => (cat || '').includes('處方') ? '<span class="tag tag-rx">處方藥</span>' : (cat || '').includes('指示') ? '<span class="tag tag-otc">指示藥</span>' : '<span class="tag">成藥</span>';
  const TODAY = new Date(2026, 8, 4); // demo 固定在 2026-09-04
  const pad2 = (n) => String(n).padStart(2, '0');
  const isoDate = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  const birthISO = (b) => `${b.y}-${pad2(b.m)}-${pad2(b.d)}`;
  const parseISO = (s) => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? { y: +m[1], m: +m[2], d: +m[3] } : null; };
  function ageFrom(b) { let a = TODAY.getFullYear() - b.y; if (TODAY.getMonth() + 1 < b.m || (TODAY.getMonth() + 1 === b.m && TODAY.getDate() < b.d)) a -= 1; return a; }
  const JOB_OPTIONS = ['全職工作', '兼職工作', '退休', '家管', '學生', '待業中', '其他'];
  const RELATIVE_OPTIONS = ['父親', '母親', '祖父', '祖母', '外公', '外婆', '兄弟', '姊妹', '子女'];
  const SMOKE_OPTIONS = ['1–5 支', '6–10 支', '11–20 支', '超過 20 支'];
  const DRINK_OPTIONS = ['1–2 次', '3–4 次', '5 次以上'];
  const BETEL_OPTIONS = ['1–5 顆', '6–10 顆', '11–20 顆', '超過 20 顆'];
  const GROUPS = ['contraindications', 'dietConflicts', 'populationWarnings'];
  const STORE_KEY = 'yzt-demo-v2';

  // ── 伺服器（有就用真的，沒有就退回預載資料）─────────────────────
  const cfg = { ai: false, medProxy: false, care: false, db: false, online: false };
  async function api(path, { method = 'GET', body, token } = {}) {
    const headers = { 'content-type': 'application/json' }; if (token) headers.authorization = `Bearer ${token}`;
    const res = await fetch(path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
    const text = await res.text(); let data = null; try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }
    if (!res.ok) { const err = new Error((data && data.message) || `伺服器回應 ${res.status}`); err.status = res.status; err.code = data && data.code; throw err; }
    return data;
  }

  // ── 狀態 ────────────────────────────────────────────────────────
  const emptyUpload = () => ({ loaded: false, recognized: false, file: null, preview: '', search: '', results: [] });
  const state = {
    page: 'form', param: null, stage: 'intake', // stage: intake（調查表→辨識→確認）| home（已建檔）
    profile: JSON.parse(JSON.stringify(D.profile)),
    drugs: [],            // [{ licenseNo, drug, kid, tags, followups, quiz, usage, source, addedAt }]
    chunks: {},           // 新增藥品帶回來的仿單段落；預載的在 window.DRUG_DATA.chunks
    interactions: [],     // 兩兩比對結果（預載 + 生成）
    plainConfirmed: {},   // lic -> 按過「我都確認了」
    interactionsConfirmed: false, visitedInteractions: false,
    confirm: {}, editing: null,
    plain: {},            // lic -> { checks: {key: bool}, followups: {id: 'yes'|'no'|null} }
    interactionsChecked: {},
    quiz: { answers: {}, submitted: false, passed: false }, // answers 以題目 id 為鍵
    doses: [], prnLogs: {}, slotOverrides: {},
    cabinet: D.cabinet.map((c) => ({ ...c, disposed: false })),
    care: { notify: true, notified: false, account: null, invite: null, relationships: [], lastSync: null },
    caregiver: { account: null, relationships: [], selected: null, snapshot: null, error: '' },
    qa: { sessions: [], current: null, seq: 0 },
    upload: emptyUpload(),
    add: null,            // 新增藥品流程：{ items: [...], prescription, progress }
    speech: { rate: 1, speaking: false },
  };
  const entryOf = (lic) => state.drugs.find((e) => e.licenseNo === lic);
  const drugOf = (lic) => (entryOf(lic) || {}).drug;
  const chunkOf = (id) => state.chunks[id] || window.DRUG_DATA.chunks[id];
  const shortName = (lic) => { const d = drugOf(lic); return d ? d.nameZh.replace(/^"[^"]*"\s*/, '').replace(/膜衣錠.*$/, '膜衣錠').replace(/錠.*$/, '錠') : lic; };
  const usageOf = (lic) => (entryOf(lic) || {}).usage || {};
  const usageLine = (lic) => { const u = usageOf(lic); return u.dose ? `一次 ${u.dose}，${u.freq}${u.timing ? '，' + u.timing : ''}${u.note ? '，' + u.note : ''}` : ''; };

  // 預載：三款藥 + 三組交互作用 + 題目
  const withIds = () => D.quiz.map((q, i) => ({ ...q, id: `${q.drug}:${i}` }));
  function preloadEntries() {
    return window.DRUG_DATA.drugs.map((drug) => {
      const lic = drug.licenseNo;
      const item = [...D.recognition.items, ...D.recognition.fromForm].find((i) => i.licenseNo === lic) || {};
      return { licenseNo: lic, drug, kid: D.plainKid[lic], tags: D.tags[lic], followups: (D.followups[lic] || []).map((f) => ({ ...f })), quiz: withIds().filter((q) => q.drug === lic), usage: { dose: item.dose, freq: item.freq, timing: item.timing || '', route: item.route, days: item.days ?? null, note: item.note || '', raw: item.raw, freqRaw: item.freqRaw, confidence: item.confidence, reason: item.reason }, source: D.recognition.items.some((i) => i.licenseNo === lic) ? 'bag' : 'form', addedAt: null };
    });
  }
  function preloadInteractions() {
    const ixQuiz = withIds().find((q) => q.drug === 'interaction');
    return D.interactions.map((x, k) => ({ ...x, source: 'leaflet', aiNote: '', quiz: k === 0 && ixQuiz ? ixQuiz : null }));
  }
  const BOUNDARY_QUIZ = withIds().filter((q) => q.drug === 'boundary');
  function quizItems() { return [...state.drugs.flatMap((e) => e.quiz || []), ...state.interactions.flatMap((x) => (x.quiz ? [x.quiz] : [])), ...BOUNDARY_QUIZ]; }

  function initDemo() {
    state.drugs = preloadEntries(); state.interactions = preloadInteractions();
    state.drugs.forEach((e) => { state.confirm[e.licenseNo] = true; });
    quizItems().forEach((q) => { state.quiz.answers[q.id] = q.answer; }); // 預載題目預先選好正確答案
    D.qaHistory.forEach((h) => { const s = { id: 's' + (++state.qa.seq), title: h.qs[0], date: h.date, messages: [] }; h.qs.forEach((q) => { s.messages.push({ role: 'user', text: q }); s.messages.push({ role: 'bot', ...ruleAnswer(q) }); }); state.qa.sessions.push(s); });
  }

  // ── 持久化（重新整理不會消失；「更多功能 → 重設示範資料」清掉）──
  const PERSIST = ['stage', 'profile', 'drugs', 'chunks', 'interactions', 'plainConfirmed', 'interactionsConfirmed', 'visitedInteractions', 'confirm', 'plain', 'interactionsChecked', 'quiz', 'doses', 'prnLogs', 'slotOverrides', 'cabinet', 'care', 'qa'];
  const CG_KEY = 'yzt-caregiver-v1'; // 照護者模式另存一把，同一個瀏覽器開兩個分頁才不會互相覆蓋
  function save() { try { const o = {}; PERSIST.forEach((k) => { o[k] = state[k]; }); localStorage.setItem(STORE_KEY, JSON.stringify(o)); localStorage.setItem(CG_KEY, JSON.stringify({ account: state.caregiver.account, selected: state.caregiver.selected })); } catch (e) { /* 存不了就算了 */ } }
  function load() {
    try { const cg = JSON.parse(localStorage.getItem(CG_KEY) || 'null'); if (cg && cg.account) { state.caregiver.account = cg.account; state.caregiver.selected = cg.selected || null; } } catch (e) { /* 忽略 */ }
    try { const raw = localStorage.getItem(STORE_KEY); if (!raw) return false; const o = JSON.parse(raw); if (!o || !Array.isArray(o.drugs) || !o.drugs.length) return false; PERSIST.forEach((k) => { if (o[k] !== undefined) state[k] = o[k]; }); return true; } catch (e) { return false; }
  }
  // #12 重設也把雲端的照護帳號刪掉，不留孤兒資料
  async function resetDemo() {
    try { if (state.care.account) await careCall('owner', '/v1/account', { method: 'DELETE' }); } catch (e) { /* 已失效也算 */ }
    try { if (state.caregiver.account) await careCall('caregiver', '/v1/account', { method: 'DELETE' }); } catch (e) { /* 同上 */ }
    try { localStorage.removeItem(STORE_KEY); localStorage.removeItem(CG_KEY); } catch (e) { /* 忽略 */ }
    location.hash = ''; location.reload();
  }

  const pages = {};

  // ── 1. 健康調查表 ───────────────────────────────────────────────
  pages.form = {
    render() {
      const p = state.profile;
      const chk = (name, val, label, checked, extra = '') => `<label class="choice"><input type="checkbox" name="${name}" value="${val}" ${checked ? 'checked' : ''}> ${label}${extra}</label>`;
      const rad = (name, val, label, checked, extra = '') => `<label class="choice"><input type="radio" name="${name}" value="${val}" ${checked ? 'checked' : ''}> ${label}${extra}</label>`;
      const inl = (name, val, ph = '') => `<input class="inline-input" type="text" name="${name}" value="${esc(val)}" placeholder="${ph}">`;
      const qsel = (name, opts, cur) => `<select class="inline-select" name="${name}">${opts.map((o) => `<option ${o === cur ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
      const fam = (k, label) => `<div class="fam-row">${chk('family_' + k, '1', label, !!p.familyItems[k])}${multiSel('familyWho_' + k, RELATIVE_OPTIONS, splitTiming(p.familyItems[k]))}</div>`;
      return `
      <h1 class="page-title">綜合健康檢查與疾病史調查表</h1>
      <p class="page-lead">為建立完整健康檔案並提供精準醫療評估，請詳實填寫以下資訊，所有資料均嚴格保密。</p>
      <form id="health-form" novalidate>
        <fieldset>
          <legend>一、基本資料與職業</legend>
          <div class="form-grid">
            <label class="field"><span>暱稱</span><input type="text" name="name" value="${esc(p.name)}" required></label>
            <div class="field"><span>性別</span><div class="choice-row">${rad('sex', 'male', '男', p.sex === 'male')}${rad('sex', 'female', '女', p.sex === 'female')}</div></div>
            <label class="field"><span>出生</span><div class="choice-row"><input type="date" name="birth" value="${birthISO(p.birth)}" min="1900-01-01" max="${isoDate(TODAY)}" required><span class="age-out" id="birth-age">${p.age != null ? p.age + ' 歲' : ''}</span></div></label>
            <label class="field"><span>身高（cm）</span><input type="number" name="height" value="${p.height}" required></label>
            <label class="field"><span>體重（kg）</span><input type="number" name="weight" value="${p.weight}" required></label>
            <label class="field"><span>聯絡電話</span><input type="text" name="phone" value="${esc(p.phone)}"></label>
          </div>
          <label class="field" style="margin-top:.6rem;max-width:20rem"><span>就業狀況</span><select name="job">${JOB_OPTIONS.map((o) => `<option ${o === p.job ? 'selected' : ''}>${o}</option>`).join('')}</select></label>
        </fieldset>

        <fieldset>
          <legend>二、過敏史</legend>
          <div class="subhead">是否曾對<strong>食物或其他物質</strong>過敏？（如海鮮、堅果、乳膠、顯影劑）</div>
          <div class="choice-row">${rad('foodAllergy', 'no', '否', p.foodAllergy === 'no')}${rad('foodAllergy', 'yes', '是', p.foodAllergy === 'yes')}（說明：${inl('foodAllergyDetail', p.foodAllergyDetail)}）</div>
        </fieldset>

        <fieldset>
          <legend>三、過去病史與手術住院史</legend>
          <div class="subhead">【先天與慢性疾病】（可複選）</div>
          <div class="choice-row">${D.chronicOptions.map(([k, l]) => chk('chronic', k, l, p.chronic.includes(k), k === 'other' ? '：' + inl('chronicOther', p.chronicOther) : '')).join('')}</div>
          <div class="subhead">【手術與重大住院紀錄】</div>
          <div class="choice-row">${rad('surgery', 'no', '無任何手術或重大住院紀錄', p.surgery === 'no')}${rad('surgery', 'yes', '有', p.surgery === 'yes')}（請列出年份與手術／住院原因：${inl('surgeryDetail', p.surgeryDetail)}）</div>
          <div class="choice-row">補充說明：${inl('surgeryNote', p.surgeryNote)}</div>
        </fieldset>

        <fieldset>
          <legend>四、家族病史 <span class="choice-note">（一至二等親：父母、祖父母、兄弟姊妹、子女）</span></legend>
          <div class="choice-row">${rad('family', 'no', '家屬皆無重大遺傳疾病或慢性病', p.family === 'no')}</div>
          <div class="choice-row">${rad('family', 'yes', '有以下家族病史（請勾選並註明親屬關係，如：父親、外婆）：', p.family === 'yes')}</div>
          <div class="fam-grid" style="padding-left:1.6rem">${fam('cancer', '癌症')}${fam('stroke', '腦中風')}${fam('diabetes', '糖尿病')}${fam('hypertension', '高血壓')}${fam('heart', '心臟病')}${fam('mental', '精神疾病')}<div class="fam-row fam-other">${chk('family_other', '1', '其他', !!p.familyItems.other)}<input class="inline-input" type="text" name="familyOtherName" value="${esc(p.familyOtherName)}" placeholder="疾病名稱，例如：痛風、氣喘">${multiSel('familyWho_other', RELATIVE_OPTIONS, splitTiming(p.familyItems.other))}</div></div>
        </fieldset>

        <fieldset>
          <legend>五、目前用藥狀況</legend>
          <div class="subhead">是否經常服用<strong>成藥、保健食品或中藥</strong>？</div>
          <div class="choice-row">${rad('otcMeds', 'no', '否', p.otcMeds === 'no')}${rad('otcMeds', 'yes', '是', p.otcMeds === 'yes')}（請列出：${inl('otcMedsDetail', p.otcMedsDetail)}）</div>
        </fieldset>

        <fieldset>
          <legend>六、生活習慣與環境暴露</legend>
          <div class="form-grid">
            <div class="field"><span>抽菸習慣</span>${rad('smoking', 'no', '否', p.smoking === 'no')}${rad('smoking', 'quit', '已戒菸', p.smoking === 'quit')}${rad('smoking', 'yes', '有', p.smoking === 'yes', '　每日 ' + qsel('smokingPerDay', SMOKE_OPTIONS, p.smokingPerDay))}</div>
            <div class="field"><span>飲酒習慣</span>${rad('alcohol', 'no', '否', p.alcohol === 'no')}${rad('alcohol', 'occasional', '偶爾', p.alcohol === 'occasional')}${rad('alcohol', 'often', '經常', p.alcohol === 'often', '　每週 ' + qsel('alcoholPerWeek', DRINK_OPTIONS, p.alcoholPerWeek))}</div>
            <div class="field"><span>嚼檳榔習慣</span>${rad('betel', 'no', '否', p.betel === 'no')}${rad('betel', 'quit', '已戒除', p.betel === 'quit')}${rad('betel', 'yes', '有', p.betel === 'yes', '　每日 ' + qsel('betelPerDay', BETEL_OPTIONS, p.betelPerDay))}</div>
            <div class="field"><span>運動習慣</span>${rad('exercise', 'none', '幾乎沒有', p.exercise === 'none')}${rad('exercise', '1-2', '每週 1-2 次', p.exercise === '1-2')}${rad('exercise', '3+', '每週 3 次以上', p.exercise === '3+')}</div>

            <div class="field"><span>飲食偏好</span>${rad('diet', 'balanced', '均衡飲食', p.diet === 'balanced')}${rad('diet', 'salty', '偏重口味 (高鹽/油/糖)', p.diet === 'salty')}${rad('diet', 'veg', '全素 / 蛋奶素', p.diet === 'veg')}</div>

  // ── 8. 提醒排程與更改時間 ─────────────────────────────────────────
  function scheduleFor(e) {
    const lic = e.licenseNo; const pre = D.schedule.find((s) => s.licenseNo === lic); const u = e.usage || {};

    const orig = [...D.recognition.items, ...D.recognition.fromForm].find((i) => i.licenseNo === lic);
    const usageChanged = !orig || orig.freq !== u.freq || (orig.timing || '') !== (u.timing || '');
    const usePre = pre && !pre.prn && !e.addedAt && !usageChanged && !state.slotOverrides[lic];
    let slots;

    }
    return { licenseNo: lic, slots, prn: false, label: usePre ? pre.label : (u.timing || ''), note: usePre ? pre.note : `${u.freq || ''}${u.timing ? '，' + u.timing : ''}` };
  }

  pages.report = {

  const randId = () => (typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
  async function careCall(who, path, opts = {}) {
    const box = who === 'owner' ? state.care : state.caregiver;

    catch (e) {
      if (e.status !== 401 || !box.account) throw e;
      const r = await api('/api/care/v1/auth/login', { method: 'POST', body: { email: box.account.email, password: box.account.password } });
      box.account.token = r.accessToken; box.account.accountId = r.accountId || box.account.accountId; save();
      return call();
    }
  }

    const r = await api('/api/care/v1/auth/register', { method: 'POST', body: { email, password, displayName } });
    box.account = { email, password, token: r.accessToken, accountId: r.accountId, displayName }; save();

    const showBack = state.page === 'form' ? state.stage === 'home' : state.page !== 'home';
    const backLabel = state.page === 'upload' ? (state.stage === 'home' ? '返回藥品清單' : '返回調查表') : state.page === 'confirm' ? '返回上傳' : state.page === 'caregiver' && state.stage !== 'home' ? '返回調查表' : '返回藥品清單';
    const backRow = showBack ? `<div class="back-row"><button class="btn btn-small" id="back" type="button">‹ ${backLabel}</button></div>` : '';
    $('#main').innerHTML = `<div class="page is-active" data-step="${state.page}">${backRow}${page.render(step)}${actionRow}</div>`;
    if (page.bind) page.bind(step);
    if (act) $('#action-btn').addEventListener('click', runAction);
    if (showBack) $('#back').addEventListener('click', goBack);
    // 頂欄只有字級與「更多功能」；送出調查表後就出現（照護者模式不顯示）
    $('#menu-btn').hidden = (state.page === 'form' && state.stage !== 'home') || state.page === 'caregiver';
    document.title = (PAGE_TITLE[state.page] || '藥智通') + ' · 藥智通';
    updateAction(); save();
  }
  function updateAction() {
    const act = ACTIONS[state.page]; if (!act || !$('#action-btn')) return;
    const page = pages[state.page]; const g = page.gate ? page.gate({ id: state.page, lic: state.param }) : { ok: true, note: '' };
    const note = $('#action-note'); note.textContent = g.note || ''; note.dataset.tone = g.tone !== undefined ? g.tone : (g.ok ? '' : 'block');
    const btn = $('#action-btn'); btn.textContent = typeof act.label === 'function' ? act.label() : act.label; btn.disabled = !g.ok;
  }
  function setFoot(text, disabled) { const n = $('#action-note'); if (n) n.textContent = text; const b = $('#action-btn'); if (b) b.disabled = disabled; }
  async function runAction() { const act = ACTIONS[state.page]; if (!act) return; $('#action-btn').disabled = true; await act.run(); updateAction(); }

  // 更多功能選單（跟 App 一樣：文字標籤，不是一排圖示）
  function openMenu() { $('#menu').hidden = false; $('#menu-btn').setAttribute('aria-expanded', 'true'); }
  function closeMenu() { const m = $('#menu'); if (m) { m.hidden = true; $('#menu-btn').setAttribute('aria-expanded', 'false'); } }

  let toastTimer;
  function toast(text) { let t = $('#toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); } t.textContent = text; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 2600); }
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const nowHM = () => new Date().toTimeString().slice(0, 5);
  const localTime = (iso) => { const d = new Date(iso); return Number.isNaN(d.getTime()) ? '' : `${d.getMonth() + 1}/${d.getDate()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };

  // 字級
  function setScale(s) { document.body.dataset.scale = s; $$('.scale-switch button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.scale === s)); try { localStorage.setItem('scale', s); } catch (e) { /* 忽略 */ } }

  // ── 啟動 ─────────────────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', async () => {
    $('#menu-btn').addEventListener('click', () => ($('#menu').hidden ? openMenu() : closeMenu()));
    $$('#menu [data-nav]').forEach((b) => b.addEventListener('click', () => { closeMenu(); navigate(b.dataset.nav); }));
    const rs = $('#menu [data-reset]'); if (rs) rs.addEventListener('click', () => { closeMenu(); if (window.confirm('會清掉新增的藥品、打卡、對話與照護設定，回到示範的起點。確定嗎？')) resetDemo(); });
    document.addEventListener('click', (e) => { if (!e.target.closest('#menu') && !e.target.closest('#menu-btn')) closeMenu(); });
    $$('.scale-switch button').forEach((b) => b.addEventListener('click', () => setScale(b.dataset.scale)));
    let saved = 'normal'; try { saved = localStorage.getItem('scale') || 'normal'; } catch (e) { /* 忽略 */ }
    setScale(saved);
    try { Object.assign(cfg, await api('/api/config'), { online: true }); } catch (e) { /* 純靜態，沒有伺服器 */ }
    if (!load()) initDemo();
    // 排練用：#page=home 直接跳到建檔後的首頁；#page=caregiver 是另一支手機的入口
    const m = location.hash.match(/page=([a-z]+)/);
    if (m && pages[m[1]]) { state.page = m[1]; if (!['form', 'upload', 'confirm', 'caregiver'].includes(m[1])) { state.stage = 'home'; state.upload = { ...state.upload, loaded: true, recognized: true }; } if (m[1] === 'plain') state.param = state.drugs[0].licenseNo; }
    else if (state.stage === 'home') state.page = 'home';
    renderPage();
    window.__demo = { state, navigate, cfg };
  });
})();

</script>
</body>
</html>
